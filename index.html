//  AUDIO MANAGER (Vlastní hudba MP3 + Zvukové efekty)
// ─────────────────────────────────────────────
class AudioManager {
    constructor() {
        this.ctx = null;
        this.enabled = true;
        this.initialized = false;

        // MP3 podkresová hudba (hraje nepřetržitě v celé hře)
        this.bgMusic = document.getElementById('bgMusic') || new Audio('hudba.mp3');
        this.bgMusic.loop = true;
        this.bgMusic.volume = 0.55;

        // Procedurální fallback (pokud by chyběl soubor)
        this.currentTrack = null;
        this.musicStep = 0;
        this.nextNoteTime = 0;
        this.stepDuration = 0.14;
        this.humGain = null;
        this.humOsc = null;
    }

    startBgMusic() {
        if (!this.enabled || !this.bgMusic) return;
        if (this.bgMusic.paused) {
            const p = this.bgMusic.play();
            if (p && p.catch) p.catch(() => {});
        }
    }

    toggleSound() {
        if (!this.initialized) this.init();
        this.enabled = !this.enabled;
        if (!this.enabled) {
            if (this.bgMusic) {
                this.bgMusic.muted = true;
                this.bgMusic.pause();
            }
            if (this.humGain && this.ctx) this.humGain.gain.setValueAtTime(0, this.ctx.currentTime);
        } else {
            if (this.bgMusic) {
                this.bgMusic.muted = false;
                const p = this.bgMusic.play();
                if (p && p.catch) p.catch(() => {});
            }
            this.play('click');
        }
        return this.enabled;
    }

    init() {
        if (!this.initialized) {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();
                this.initialized = true;
                this._setupMotorHum();
            } catch(e) {}
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
        this.startBgMusic();
    }

            _setupMotorHum() {
                if (!this.ctx) return;
                try {
                    this.humGain = this.ctx.createGain();
                    this.humGain.gain.setValueAtTime(0, this.ctx.currentTime);
                    this.humGain.connect(this.ctx.destination);

                    this.humOsc = this.ctx.createOscillator();
                    this.humOsc.type = 'sawtooth';
                    this.humOsc.frequency.setValueAtTime(65, this.ctx.currentTime);

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(120, this.ctx.currentTime);

                    this.humOsc.connect(filter).connect(this.humGain);
                    this.humOsc.start();
                } catch (e) { }
            }

    updateMotorHum(enemyCount) {
        if (!this.enabled || !this.humGain || !this.ctx) return;
        const targetVol = enemyCount > 0 ? Math.min(0.035, 0.01 + enemyCount * 0.0025) : 0;
        this.humGain.gain.setTargetAtTime(targetVol, this.ctx.currentTime, 0.3);
    }

    setTrack(track) {
        this.currentTrack = track;
        this.musicStep = 0;
        if (this.ctx) this.nextNoteTime = this.ctx.currentTime + 0.1;
        this.startBgMusic();
    }

    updateMusic() {
        // Pokud hraje MP3, procedurální hudbu nepouštíme
        if (this.bgMusic && !this.bgMusic.paused) return;

        if (!this.enabled || !this.ctx || !this.currentTrack) return;
        if (this.ctx.state === 'suspended') return;

                const now = this.ctx.currentTime;
                while (this.nextNoteTime < now + 0.25) {
                    this._playMusicStep(this.musicStep, this.currentTrack, this.nextNoteTime);
                    this.nextNoteTime += this.stepDuration;
                    this.musicStep = (this.musicStep + 1) % 64;
                }
            }

            _playMusicStep(step, track, time) {
                if (!this.enabled || !this.ctx) return;

                if (track === 'menu') {
                    // Teplá, útulná melodie pro menu (C - G - Am - F)
                    const chords = [
                        [261.6, 329.6, 392.0, 493.9], // Cmaj7
                        [196.0, 246.9, 293.7, 392.0], // G
                        [220.0, 261.6, 329.6, 392.0], // Am7
                        [174.6, 220.0, 261.6, 349.2]  // F
                    ];
                    const chordIdx = Math.floor(step / 16) % 4;
                    const subStep = step % 16;
                    const chord = chords[chordIdx];

                    // Akordový tón na začátku taktu
                    if (subStep === 0) {
                        this._synthTone(chord[0] * 0.5, 0.04, 1.2, 'triangle', time);
                    }
                    // Jemná arpeggiata melodie
                    if (subStep % 2 === 0) {
                        const note = chord[subStep % chord.length];
                        this._synthTone(note, 0.025, 0.25, 'sine', time);
                    }
                } else if (track === 'game') {
                    // Dynamická, rytmická TD bojová hudba
                    const bassNotes = [130.8, 130.8, 110.0, 110.0, 87.3, 87.3, 98.0, 98.0]; // C, Am, F, G
                    const bass = bassNotes[Math.floor(step / 8) % bassNotes.length];

                    // Basa
                    if (step % 4 === 0 || step % 4 === 2) {
                        this._synthTone(bass, 0.04, 0.18, 'triangle', time);
                    }
                    // Hi-hat tick
                    if (step % 2 === 1) {
                        this._noiseAt(0.02, 6000, 0.015, time);
                    }
                    // Snare
                    if (step % 8 === 4) {
                        this._noiseAt(0.06, 1800, 0.03, time);
                    }
                    // Melodická linka
                    const scale = [523.25, 587.33, 659.25, 783.99, 880.0]; // C D E G A
                    if (step % 4 === 0 && Math.random() < 0.75) {
                        const mel = scale[(step * 3) % scale.length];
                        this._synthTone(mel, 0.022, 0.2, 'sine', time);
                    }
                }
            }

            _synthTone(freq, vol, dur, type = 'sine', time = null) {
                if (!this.ctx) return;
                const t = time || this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(vol, t);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                osc.connect(gain).connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + dur);
            }

            _noiseAt(dur, filterFreq, vol, time = null) {
                if (!this.ctx) return;
                const t = time || this.ctx.currentTime;
                const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * dur), this.ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
                const src = this.ctx.createBufferSource();
                src.buffer = buf;
                const filt = this.ctx.createBiquadFilter();
                filt.type = 'highpass';
                filt.frequency.setValueAtTime(filterFreq, t);
                const g = this.ctx.createGain();
                g.gain.setValueAtTime(vol, t);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                src.connect(filt).connect(g).connect(this.ctx.destination);
                src.start(t);
                src.stop(t + dur);
            }

            play(type) {
                if (!this.enabled || !this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                switch (type) {
                    case 'hover': this._beep(900, 0.015, 0.03, 'sine'); break;
                    case 'click': this._beep(600, 0.04, 0.06, 'triangle'); break;
                    case 'pause': this._playNotes([659, 523], 0.06); break;
                    case 'suction': this._suction(); break;
                    case 'whoosh': this._noise(0.35, 1200, 0.07); break;
                    case 'select': this._playNotes([523, 659, 784], 0.07); break;
                    case 'locked': this._beep(160, 0.08, 0.12, 'sawtooth'); break;
                    case 'build': this._playNotes([392, 523, 659, 784], 0.05); break;
                    case 'upgrade': this._playNotes([523, 659, 784, 1046], 0.05); break;
                    case 'sell': this._playNotes([784, 523], 0.07); break;
                    case 'error': this._beep(140, 0.1, 0.14, 'sawtooth'); break;
                    case 'hit': this._noise(0.03, 500, 0.03); break;
                    case 'crit': this._playNotes([900, 1400], 0.05); break;
                    case 'laser': this._laser(); break;
                    case 'ice': this._beep(1300, 0.035, 0.14, 'sine'); break;
                    case 'splat': this._noise(0.12, 250, 0.08); break;
                    case 'poison': this._beep(420, 0.03, 0.1, 'sine'); break;
                    case 'stun': this._noise(0.12, 120, 0.1); break;
                    case 'die': this._playNotes([450, 320, 220], 0.04); break;
                    case 'emp': this._noise(0.25, 850, 0.14); break;
                    case 'hurt': this._playNotes([260, 180], 0.15); break;
                    case 'win': this._playNotes([523, 659, 784, 1046, 1318], 0.09); break;
                    case 'lose': this._playNotes([400, 340, 280, 220], 0.14); break;
                    case 'wave': this._playNotes([440, 554, 659, 880], 0.08); break;
                    case 'pause': this._beep(440, 0.04, 0.08, 'triangle'); break;
                }
            }

            _beep(freq, vol, dur, type = 'sine') {
                this._synthTone(freq, vol, dur, type);
            }

            _playNotes(freqs, step) {
                const t = this.ctx.currentTime;
                freqs.forEach((f, i) => {
                    this._synthTone(f, 0.05, step * 1.6, 'triangle', t + i * step);
                });
            }

            _laser() {
                const t = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(1600, t);
                osc.frequency.exponentialRampToValueAtTime(180, t + 0.14);
                gain.gain.setValueAtTime(0.08, t);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
                osc.connect(gain).connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + 0.14);
            }

            _noise(dur, filterFreq, vol) {
                this._noiseAt(dur, filterFreq, vol);
            }

            _suction() {
                const t = this.ctx.currentTime;
                const noise = this.ctx.createBufferSource();
                const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * 1.8), this.ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
                noise.buffer = buf;
                const bandpass = this.ctx.createBiquadFilter();
                bandpass.type = 'bandpass';
                bandpass.frequency.setValueAtTime(280, t);
                bandpass.frequency.linearRampToValueAtTime(900, t + 1.4);
                bandpass.Q.value = 2.5;
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.12, t + 0.25);
                gain.gain.setValueAtTime(0.12, t + 1.1);
                gain.gain.linearRampToValueAtTime(0, t + 1.7);
                noise.connect(bandpass).connect(gain).connect(this.ctx.destination);
                noise.start(t);
                noise.stop(t + 1.7);
            }
        }

        // ─────────────────────────────────────────────
        //  PARTICLE SYSTEM (Třpytky, kouř, konfety, prach)
        // ─────────────────────────────────────────────
        class Particle {
            constructor(x, y, opts = {}) {
                this.x = x; this.y = y;
                this.vx = opts.vx || (Math.random() - 0.5) * 80;
                this.vy = opts.vy || (Math.random() - 0.5) * 80;
                this.size = opts.size || 3;
                this.color = opts.color || '#FFD700';
                this.life = opts.life || 1.0;
                this.maxLife = this.life;
                this.decay = opts.decay || 1.0;
                this.attractTo = opts.attractTo || null;
                this.attractForce = opts.attractForce || 400;
                this.shape = opts.shape || 'circle'; // circle, square, star, smoke, confetti
                this.rot = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 6;
                this.gravity = opts.gravity || 0;
            }

            update(dt) {
                if (this.attractTo) {
                    const dx = this.attractTo.x - this.x, dy = this.attractTo.y - this.y;
                    const d = Math.sqrt(dx * dx + dy * dy) || 1;
                    this.vx += (dx / d) * this.attractForce * dt;
                    this.vy += (dy / d) * this.attractForce * dt;
                    this.vx *= 0.95; this.vy *= 0.95;
                }
                this.vy += this.gravity * dt;
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.rot += this.vRot * dt;
                this.life -= this.decay * dt;
            }

            render(ctx) {
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rot);
                ctx.fillStyle = this.color;

                if (this.shape === 'confetti') {
                    ctx.fillRect(-this.size, -this.size * 0.5, this.size * 2, this.size);
                } else if (this.shape === 'star') {
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        ctx.lineTo(Math.cos((18 + i * 72) * 0.0174) * this.size, -Math.sin((18 + i * 72) * 0.0174) * this.size);
                        ctx.lineTo(Math.cos((54 + i * 72) * 0.0174) * (this.size * 0.4), -Math.sin((54 + i * 72) * 0.0174) * (this.size * 0.4));
                    }
                    ctx.closePath();
                    ctx.fill();
                } else if (this.shape === 'smoke') {
                    const currentSize = this.size * (2 - alpha);
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, currentSize, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            get dead() { return this.life <= 0; }
        }

        class ParticleSystem {
            constructor() { this.particles = []; }

            emit(x, y, count, opts = {}) {
                for (let i = 0; i < count; i++) this.particles.push(new Particle(x, y, { ...opts }));
            }

            emitExplosion(x, y, color = '#FF6B35', count = 14) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 40 + Math.random() * 140;
                    this.particles.push(new Particle(x, y, {
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        color,
                        size: 2.5 + Math.random() * 3.5,
                        life: 0.5 + Math.random() * 0.4,
                        decay: 1.3
                    }));
                }
            }

            emitDust(x, y, count = 2) {
                for (let i = 0; i < count; i++) {
                    this.particles.push(new Particle(x + (Math.random() - 0.5) * 8, y + (Math.random() - 0.5) * 8, {
                        vx: (Math.random() - 0.5) * 20,
                        vy: (Math.random() - 0.5) * 15,
                        color: 'rgba(210, 195, 175, 0.4)',
                        size: 3 + Math.random() * 3,
                        life: 0.4,
                        decay: 1.2,
                        shape: 'smoke'
                    }));
                }
            }

            emitConfetti(count = 50) {
                const colors = ['#FF1744', '#FFEA00', '#00E676', '#00B0FF', '#D500F9', '#FF9100'];
                for (let i = 0; i < count; i++) {
                    this.particles.push(new Particle(Math.random() * W, -20 - Math.random() * 80, {
                        vx: (Math.random() - 0.5) * 100,
                        vy: 60 + Math.random() * 120,
                        gravity: 40,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        size: 5 + Math.random() * 4,
                        life: 3.5 + Math.random() * 1.5,
                        decay: 0.3,
                        shape: 'confetti'
                    }));
                }
            }

            update(dt) {
                for (const p of this.particles) p.update(dt);
                this.particles = this.particles.filter(p => !p.dead);
            }

            render(ctx) { for (const p of this.particles) p.render(ctx); }
        }

        // ─────────────────────────────────────────────
        //  FLOATING TEXT (Damage, zlatá klubíčka, texty)
        // ─────────────────────────────────────────────
        class FloatingText {
            constructor(x, y, text, color = '#FFF', size = 14, isCrit = false) {
                this.x = x + (Math.random() - 0.5) * 12;
                this.y = y;
                this.text = text;
                this.color = color;
                this.size = size;
                this.isCrit = isCrit;
                this.life = 0.85;
                this.maxLife = 0.85;
            }

            update(dt) {
                this.y -= (this.isCrit ? 45 : 32) * dt;
                this.life -= dt;
            }

            render(ctx) {
                const alpha = Math.max(0, this.life / this.maxLife);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.font = `bold ${this.size}px 'Segoe UI', Arial, sans-serif`;
                ctx.textAlign = 'center';

                if (this.isCrit) {
                    ctx.shadowColor = '#FFD700';
                    ctx.shadowBlur = 10;
                }

                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.strokeText(this.text, this.x, this.y);
                ctx.fillStyle = this.color;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }

            get dead() { return this.life <= 0; }
        }

        // ─────────────────────────────────────────────
        //  UTILITY FUNKCE
        // ─────────────────────────────────────────────
        function shadeColor(color, amount) {
            if (!color || !color.startsWith('#')) return color || '#888';
            let hex = color.slice(1);
            if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
            let r = Math.min(255, Math.max(0, parseInt(hex.substr(0, 2), 16) + amount));
            let g = Math.min(255, Math.max(0, parseInt(hex.substr(2, 2), 16) + amount));
            let b = Math.min(255, Math.max(0, parseInt(hex.substr(4, 2), 16) + amount));
            return `rgb(${r},${g},${b})`;
        }

        function roundRect(ctx, x, y, w, h, r) {
            r = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function pointInRect(px, py, rx, ry, rw, rh) {
            return px >= rx && px <= rx + rw && py >= ry && py <= ry + rh;
        }

        function dist(x1, y1, x2, y2) {
            const dx = x1 - x2, dy = y1 - y2;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function lerp(a, b, t) { return a + (b - a) * t; }
        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
        function easeOutBack(t) { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }

        // ─────────────────────────────────────────────
        //  VINTAGE PIXEL-ART ENGINE (Čtverečkované hry)
        // ─────────────────────────────────────────────
        function pRect(ctx, x, y, w, h, col) {
            if (col) ctx.fillStyle = col;
            ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
        }

        function pBox(ctx, x, y, w, h, bg, border = '#000', highlight = '#FFF', shadow = '#222') {
            x = Math.floor(x); y = Math.floor(y); w = Math.floor(w); h = Math.floor(h);
            // Vnější černý obrys
            ctx.fillStyle = '#000000';
            ctx.fillRect(x, y, w, h);
            // 3D zkosený pixelový rámeček
            if (highlight && shadow) {
                ctx.fillStyle = highlight;
                ctx.fillRect(x + 2, y + 2, w - 4, 2);
                ctx.fillRect(x + 2, y + 2, 2, h - 4);
                ctx.fillStyle = shadow;
                ctx.fillRect(x + w - 4, y + 2, 2, h - 4);
                ctx.fillRect(x + 2, y + h - 4, w - 4, 2);
            }
            // Vnitřní výplň
            if (bg) {
                ctx.fillStyle = bg;
                ctx.fillRect(x + 4, y + 4, w - 8, h - 8);
            }
        }

        function drawPixelHeart(ctx, x, y, size = 12, col = '#FF1744') {
            const p = size / 8;
            ctx.fillStyle = col;
            ctx.save();
            ctx.translate(Math.floor(x), Math.floor(y));
            // 8x8 pixel heart matrix
            const heartMap = [
                " 00 00 ",
                "0000000",
                "0000000",
                "0000000",
                " 00000 ",
                "  000  ",
                "   0   "
            ];
            for (let r = 0; r < heartMap.length; r++) {
                for (let c = 0; c < heartMap[r].length; c++) {
                    if (heartMap[r][c] === '0') {
                        ctx.fillRect(Math.floor((c - 3.5) * p), Math.floor((r - 3.5) * p), Math.ceil(p), Math.ceil(p));
                    }
                }
            }
            // Bílý pixelový odlesk
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(Math.floor(-2 * p), Math.floor(-2 * p), Math.ceil(p), Math.ceil(p));
            ctx.restore();
        }

        function drawPixelYarn(ctx, x, y, size = 14, col = '#FF4081') {
            const p = size / 8;
            ctx.save();
            ctx.translate(Math.floor(x), Math.floor(y));
            // Vnější kruh v pixel stylu
            ctx.fillStyle = '#000000';
            ctx.fillRect(-4 * p, -3 * p, 8 * p, 6 * p);
            ctx.fillRect(-3 * p, -4 * p, 6 * p, 8 * p);
            // Výplň klubíčka
            ctx.fillStyle = col;
            ctx.fillRect(-3 * p, -3 * p, 6 * p, 6 * p);
            // Křížové vinutí nití (světlejší linky)
            ctx.fillStyle = '#FCE4EC';
            ctx.fillRect(-2 * p, -1 * p, 4 * p, p);
            ctx.fillRect(-1 * p, -2 * p, p, 4 * p);
            ctx.fillRect(0, 0, 2 * p, 2 * p);
            // Vystupující konec nitě
            ctx.fillStyle = col;
            ctx.fillRect(3 * p, 2 * p, 2 * p, p);
            ctx.fillRect(4 * p, 3 * p, 2 * p, p);
            ctx.restore();
        }

        function drawPixelCan(ctx, x, y, angle = 0, size = 18) {
            ctx.save();
            ctx.translate(Math.floor(x), Math.floor(y));
            ctx.rotate(angle);
            const p = size / 10;
            // Kovová obdélníková konzerva
            ctx.fillStyle = '#000000';
            ctx.fillRect(-6 * p, -4 * p, 12 * p, 8 * p);
            ctx.fillStyle = '#90A4AE';
            ctx.fillRect(-5 * p, -3 * p, 10 * p, 6 * p);
            // Žlutá etiketa s rybou
            ctx.fillStyle = '#FDD835';
            ctx.fillRect(-3 * p, -2 * p, 6 * p, 4 * p);
            ctx.fillStyle = '#0288D1';
            // Pixelová rybka na etiketě
            ctx.fillRect(-1 * p, -1 * p, 2 * p, 2 * p);
            ctx.fillRect(-2 * p, -0.5 * p, p, p);
            ctx.fillRect(1 * p, 0, p, p);
            // Kovový klíček/očko
            ctx.fillStyle = '#CFD8DC';
            ctx.fillRect(-5 * p, -1 * p, 2 * p, 2 * p);
            ctx.restore();
        }

        function drawPixelStar(ctx, x, y, size = 10, filled = true) {
            const p = size / 6;
            ctx.save();
            ctx.translate(Math.floor(x), Math.floor(y));
            ctx.fillStyle = filled ? '#FFD700' : '#455A64';
            const starMap = [
                "  0  ",
                " 000 ",
                "00000",
                " 000 ",
                " 0 0 "
            ];
            for (let r = 0; r < starMap.length; r++) {
                for (let c = 0; c < starMap[r].length; c++) {
                    if (starMap[r][c] === '0') {
                        ctx.fillRect(Math.floor((c - 2) * p), Math.floor((r - 2) * p), Math.ceil(p), Math.ceil(p));
                    }
                }
            }
            ctx.restore();
        }

        // ─────────────────────────────────────────────
        //  SPRITES & PROCEDURÁLNÍ KRESLENÍ (Vintage Pixel-Art)
        // ─────────────────────────────────────────────
        class Sprites {
            // Kreslení kočičí věže ve stylu 16-bit vintage čtverečkovaných her
            static drawCatTower(ctx, x, y, typeId, level, opts = {}) {
                const type = TOWER_TYPES[typeId];
                const s = (opts.size || 22) * (opts.scale || 1.0);
                const angle = opts.angle || 0;
                const disabled = opts.disabled || false;
                const buffed = opts.buffed || false;
                const fury = opts.fury || false;
                const recoil = opts.recoil || 0;
                const animTime = opts.animTime || 0;

                ctx.save();
                ctx.translate(Math.floor(x), Math.floor(y));

                // 1. Pixelová aura (Sfinx buff)
                if (buffed) {
                    ctx.save();
                    const auraPulse = Math.floor(Math.sin(animTime * 8) * 2);
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.35)';
                    pRect(ctx, -s - 6 - auraPulse, -s - 6 - auraPulse, (s + 6 + auraPulse) * 2, (s + 6 + auraPulse) * 2);
                    ctx.fillStyle = '#FFD700';
                    // Pixelové jiskry v rozích
                    const sparkOff = Math.floor(animTime * 10) % 4;
                    pRect(ctx, -s - 4 + sparkOff, -s - 4, 3, 3);
                    pRect(ctx, s + 1 - sparkOff, -s - 4, 3, 3);
                    pRect(ctx, -s - 4, s + 1 - sparkOff, 3, 3);
                    pRect(ctx, s + 1, s + 1 - sparkOff, 3, 3);
                    ctx.restore();
                }

                // 2. Pixelová zuřivost (Micinka)
                if (fury) {
                    ctx.save();
                    const flameOff = Math.floor(Math.sin(animTime * 16) * 3);
                    ctx.fillStyle = '#FF3D00';
                    pRect(ctx, -s - 5, -s - 8 + flameOff, (s + 5) * 2, 4);
                    ctx.fillStyle = '#FF9100';
                    pRect(ctx, -s - 3, -s - 5 + flameOff, (s + 3) * 2, 3);
                    ctx.fillStyle = '#FFEA00';
                    pRect(ctx, -s, -s - 2 + flameOff, s * 2, 2);
                    ctx.restore();
                }

                // 3. Hranatý pixelový stín
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                pRect(ctx, -s * 0.8, s * 0.35, s * 1.6, s * 0.5);

                // Lunge / Recoil pohyb při útoku
                if (recoil > 0) {
                    ctx.translate(Math.floor(Math.cos(angle) * (recoil * 8)), Math.floor(Math.sin(angle) * (recoil * 8)));
                }

                // Měřítko plemene
                const breedScale = typeId === 6 ? 1.2 : (typeId === 1 || typeId === 8 ? 0.9 : 1.0);
                const bs = s * breedScale;
                const p = Math.max(2, Math.floor(bs / 8)); // Základní pixelová jednotka

                let bodyColor = disabled ? '#555555' : type.color;
                let subColor = disabled ? '#333333' : type.subColor;
                const eyeColor = disabled ? '#222222' : type.eyeColor;

                // 4. Pixelový ocas (kmitá v trhaném 8-bit rytmu)
                const tailFrame = Math.floor(Math.sin(animTime * 6 + typeId) * 2);
                ctx.fillStyle = '#000000'; // Černý obrys ocasu
                pRect(ctx, -bs * 0.7 - 2, bs * 0.1 + tailFrame * p - 2, 3 * p + 4, 3 * p + 4);
                ctx.fillStyle = bodyColor;
                pRect(ctx, -bs * 0.7, bs * 0.1 + tailFrame * p, 3 * p, 3 * p);
                // Špička ocasu (bílá nebo tmavá)
                ctx.fillStyle = subColor;
                pRect(ctx, -bs * 0.7 - p, bs * 0.1 + tailFrame * p - p, 2 * p, 2 * p);

                // 5. Pixelové tělo (černý obrys + výplň)
                const bodyW = 9 * p, bodyH = 8 * p;
                const bx = -Math.floor(bodyW / 2), by = -Math.floor(bodyH / 2) + p;

                ctx.fillStyle = '#000000';
                pRect(ctx, bx - 2, by - 2, bodyW + 4, bodyH + 4);
                ctx.fillStyle = bodyColor;
                pRect(ctx, bx, by, bodyW, bodyH);

                // Stínování spodku těla
                ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
                pRect(ctx, bx, by + bodyH - 2 * p, bodyW, 2 * p);

                // 6. Plemenné vzory na těle:
                if (typeId === 0 || typeId === 2) {
                    // Mourek & Garfield: Proužky
                    ctx.fillStyle = subColor;
                    pRect(ctx, bx + 2 * p, by + p, p, 4 * p);
                    pRect(ctx, bx + 4 * p, by + p, p, 4 * p);
                    pRect(ctx, bx + 6 * p, by + p, p, 4 * p);
                } else if (typeId === 4) {
                    // Siamka: Tmavý obličej a tlapky
                    ctx.fillStyle = subColor;
                    pRect(ctx, bx + 2 * p, by + 2 * p, 5 * p, 4 * p);
                } else if (typeId === 3 || typeId === 6) {
                    // Perská & Mainská: Huňatý bílý límec
                    ctx.fillStyle = '#FFFFFF';
                    pRect(ctx, bx + p, by + 4 * p, 7 * p, 3 * p);
                }

                // 7. Špičaté pixelové uši (stepped pixel ears)
                ctx.fillStyle = '#000000';
                pRect(ctx, bx - 2, by - 4 * p - 2, 3 * p + 4, 4 * p + 2); // Levé ucho obrys
                pRect(ctx, bx + bodyW - 3 * p - 2, by - 4 * p - 2, 3 * p + 4, 4 * p + 2); // Pravé ucho obrys

                ctx.fillStyle = bodyColor;
                pRect(ctx, bx, by - 4 * p, 3 * p, 4 * p);
                pRect(ctx, bx + bodyW - 3 * p, by - 4 * p, 3 * p, 4 * p);

                // Vnitřek uší (růžový)
                ctx.fillStyle = '#FF80AB';
                pRect(ctx, bx + p, by - 3 * p, p, 2 * p);
                pRect(ctx, bx + bodyW - 2 * p, by - 3 * p, p, 2 * p);

                // 8. Pixelové oči (velké, výrazné, s mrkáním)
                const isBlinking = (Math.sin(animTime * 2.5) > 0.94);
                if (isBlinking) {
                    ctx.fillStyle = '#000000';
                    pRect(ctx, bx + 2 * p, by + 2 * p, 2 * p, p);
                    pRect(ctx, bx + 5 * p, by + 2 * p, 2 * p, p);
                } else {
                    // Oční bulva
                    ctx.fillStyle = '#FFFFFF';
                    pRect(ctx, bx + 2 * p, by + p, 2 * p, 3 * p);
                    pRect(ctx, bx + 5 * p, by + p, 2 * p, 3 * p);
                    // Duhovka
                    ctx.fillStyle = eyeColor;
                    pRect(ctx, bx + 2 * p, by + 2 * p, 2 * p, 2 * p);
                    pRect(ctx, bx + 5 * p, by + 2 * p, 2 * p, 2 * p);
                    // Zornička
                    ctx.fillStyle = '#000000';
                    pRect(ctx, bx + 3 * p, by + 2 * p, p, 2 * p);
                    pRect(ctx, bx + 6 * p, by + 2 * p, p, 2 * p);
                    // Pixelový odlesk
                    ctx.fillStyle = '#FFFFFF';
                    pRect(ctx, bx + 2 * p, by + p, p, p);
                    pRect(ctx, bx + 5 * p, by + p, p, p);
                }

                // 9. Nos a čumáček
                ctx.fillStyle = '#FF4081';
                pRect(ctx, bx + 4 * p, by + 4 * p, p, p);
                ctx.fillStyle = '#000000';
                pRect(ctx, bx + 3 * p, by + 5 * p, p, p);
                pRect(ctx, bx + 5 * p, by + 5 * p, p, p);

                // 10. Vousky (bílé/černé pixely)
                ctx.fillStyle = typeId === 5 ? '#FFFFFF' : '#000000';
                pRect(ctx, bx - 2 * p, by + 3 * p, 2 * p, p);
                pRect(ctx, bx - 2 * p, by + 5 * p, 2 * p, p);
                pRect(ctx, bx + bodyW, by + 3 * p, 2 * p, p);
                pRect(ctx, bx + bodyW, by + 5 * p, 2 * p, p);

                // 11. Přední tlapky dole
                ctx.fillStyle = '#FFFFFF';
                pRect(ctx, bx + p, by + bodyH - p, 2 * p, 2 * p);
                pRect(ctx, bx + bodyW - 3 * p, by + bodyH - p, 2 * p, 2 * p);

                // 12. Speciální doplňky jednotlivých věží:
                if (typeId === 1) { // Micinka: růžová mašlička
                    ctx.fillStyle = '#FF4081';
                    pRect(ctx, bx + p, by - 2 * p, 2 * p, p);
                    pRect(ctx, bx + 2 * p, by - 3 * p, p, p);
                } else if (typeId === 3) { // Perská: zlatá korunka
                    ctx.fillStyle = '#FFD700';
                    pRect(ctx, bx + 3 * p, by - 2 * p, 3 * p, p);
                    pRect(ctx, bx + 2 * p, by - 3 * p, p, p);
                    pRect(ctx, bx + 4 * p, by - 4 * p, p, 2 * p);
                    pRect(ctx, bx + 6 * p, by - 3 * p, p, p);
                } else if (typeId === 7) { // Sfinx: faraonský obojek
                    ctx.fillStyle = '#FFD700';
                    pRect(ctx, bx + p, by + 5 * p, 7 * p, p);
                    ctx.fillStyle = '#00E5FF';
                    pRect(ctx, bx + 4 * p, by + 6 * p, p, p);
                } else if (typeId === 8) { // Klubíčko: pletená čepička + klubko
                    ctx.fillStyle = '#E91E63';
                    pRect(ctx, bx + p, by - 2 * p, 7 * p, 2 * p);
                    ctx.fillStyle = '#FFFFFF';
                    pRect(ctx, bx + 4 * p, by - 4 * p, 2 * p, 2 * p); // Bambulka
                    // Mini klubíčko u tlapy
                    drawPixelYarn(ctx, bx + bodyW, by + bodyH - p, 10, '#E91E63');
                } else if (typeId === 9) { // Sardinka: námořnická čapka + konzerva
                    ctx.fillStyle = '#FFFFFF';
                    pRect(ctx, bx + 2 * p, by - 3 * p, 5 * p, 2 * p);
                    ctx.fillStyle = '#1A237E';
                    pRect(ctx, bx + p, by - p, 7 * p, p);
                    ctx.fillStyle = '#FFD700';
                    pRect(ctx, bx + 4 * p, by - 2 * p, p, p); // Kotva
                    // Konzerva u tlapy
                    drawPixelCan(ctx, bx + bodyW, by + bodyH - p, 0, 12);
                }

                // 13. Hvězdičky úrovně věže (retro 8-bit hvězdy)
                if (level > 0) {
                    for (let l = 0; l < level; l++) {
                        const starX = (l - (level - 1) / 2) * 11;
                        drawPixelStar(ctx, starX, by - 5 * p - 4, 8, true);
                    }
                }

                ctx.restore();
            }

            // Kreslení robotického vysavače ve stylu 16-bit vintage arkád
            static drawEnemy(ctx, enemy) {
                const { x, y } = enemy;
                const r = enemy.radius;
                const type = ENEMY_TYPES[enemy.typeKey] || ENEMY_TYPES['basic'];
                const rot = enemy.angle || 0;
                const animTime = enemy.animTime || 0;
                const p = Math.max(2, Math.floor(r / 7));

                ctx.save();
                ctx.translate(Math.floor(x), Math.floor(y));

                // 1. Zmrazení (modrý pixelový krystal)
                if (enemy.slowTimer > 0) {
                    ctx.fillStyle = 'rgba(0, 229, 255, 0.45)';
                    pRect(ctx, -r - 4, -r - 4, (r + 4) * 2, (r + 4) * 2);
                    ctx.fillStyle = '#FFFFFF';
                    pRect(ctx, -r, -r, 3, 3);
                    pRect(ctx, r - 3, -r, 3, 3);
                    pRect(ctx, -r, r - 3, 3, 3);
                    pRect(ctx, r - 3, r - 3, 3, 3);
                }

                // 2. Omráčení (rotující pixelové hvězdy)
                if (enemy.stunTimer > 0) {
                    const sa = animTime * 8;
                    drawPixelStar(ctx, Math.cos(sa) * (r + 8), Math.sin(sa) * (r + 8), 10, true);
                    drawPixelStar(ctx, Math.cos(sa + Math.PI) * (r + 8), Math.sin(sa + Math.PI) * (r + 8), 10, true);
                }

                // 3. Pixelový stín na zemi
                ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                pRect(ctx, -r, 3, r * 2, r * 0.7);

                // Rotace těla vysavače
                ctx.rotate(rot);

                const isHitFlash = enemy.hitFlashTimer && enemy.hitFlashTimer > 0;
                let baseCol = isHitFlash ? '#FFFFFF' : type.color;

                // 4. Pojezdové pásy / kola (černé pixelové obdélníky s rotujícím vzorem)
                const wheelShift = Math.floor(animTime * 18) % 4;
                ctx.fillStyle = '#111111';
                pRect(ctx, -r * 0.7, -r * 0.95, r * 1.4, 4 * p); // Horní kolo
                pRect(ctx, -r * 0.7, r * 0.95 - 4 * p, r * 1.4, 4 * p); // Dolní kolo
                ctx.fillStyle = '#777777';
                pRect(ctx, -r * 0.5 + wheelShift * p, -r * 0.95 + p, 2 * p, 2 * p);
                pRect(ctx, -r * 0.5 + wheelShift * p, r * 0.95 - 3 * p, 2 * p, 2 * p);

                // 5. Hlavní tělo vysavače (odstupňovaný pixelový kruh)
                ctx.fillStyle = '#000000'; // Černý pixelový obrys
                pRect(ctx, -r - 2, -r * 0.7 - 2, (r + 2) * 2, r * 1.4 + 4);
                pRect(ctx, -r * 0.7 - 2, -r - 2, r * 1.4 + 4, (r + 2) * 2);

                ctx.fillStyle = baseCol; // Barva šasi
                pRect(ctx, -r, -r * 0.7, r * 2, r * 1.4);
                pRect(ctx, -r * 0.7, -r, r * 1.4, r * 2);

                // 6. Přední nárazník (bumper)
                ctx.fillStyle = '#212121';
                pRect(ctx, r * 0.3, -r * 0.7, r * 0.6, r * 1.4);
                // Červená/oranžová linka senzoru
                ctx.fillStyle = '#FF3D00';
                pRect(ctx, r * 0.7, -r * 0.5, 2, r);

                // 7. Středový sběrný poklop a LED dioda
                ctx.fillStyle = '#1A1A24';
                pRect(ctx, -r * 0.4, -r * 0.4, r * 0.8, r * 0.8);

                // Blikající centrální pixelová LED dioda
                const ledCol = (Math.floor(animTime * 6) % 2 === 0) ? (type.led || '#00FF66') : '#003300';
                ctx.fillStyle = ledCol;
                pRect(ctx, -p, -p, 2 * p, 2 * p);

                // 8. Rotující rohové zametací kartáčky
                const brushAngle = Math.floor(animTime * 14) % 4;
                ctx.fillStyle = '#EEEEEE';
                // Pravý horní kartáček
                pRect(ctx, r * 0.6, -r * 0.8 + brushAngle, p, 3 * p);
                pRect(ctx, r * 0.6 + brushAngle, -r * 0.8, 3 * p, p);
                // Pravý dolní kartáček
                pRect(ctx, r * 0.6, r * 0.8 - brushAngle - 2 * p, p, 3 * p);
                pRect(ctx, r * 0.6 + brushAngle, r * 0.8 - p, 3 * p, p);

                // 9. Speciální vizuální prvky typů:
                if (enemy.typeKey === 'turbo') {
                    // Turbo plameny za koly
                    ctx.fillStyle = '#FF6D00';
                    pRect(ctx, -r - 4 * p, -r * 0.4, 4 * p, 2 * p);
                    pRect(ctx, -r - 4 * p, r * 0.2, 4 * p, 2 * p);
                    ctx.fillStyle = '#FFEB3B';
                    pRect(ctx, -r - 2 * p, -r * 0.3, 2 * p, p);
                    pRect(ctx, -r - 2 * p, r * 0.3, 2 * p, p);
                } else if (enemy.typeKey === 'industrial') {
                    // Žluto-černé varovné pruhy
                    ctx.fillStyle = '#FFD700';
                    pRect(ctx, -r * 0.5, -r * 0.2, r, 2 * p);
                    ctx.fillStyle = '#000000';
                    pRect(ctx, -r * 0.4, -r * 0.2, p, 2 * p);
                    pRect(ctx, 0, -r * 0.2, p, 2 * p);
                } else if (enemy.typeKey === 'emp') {
                    // Bleskové výboje
                    ctx.fillStyle = '#00E5FF';
                    pRect(ctx, -r * 0.5, -r * 0.6, 2 * p, 2 * p);
                    pRect(ctx, -r * 0.5, r * 0.4, 2 * p, 2 * p);
                    if (Math.floor(animTime * 12) % 2 === 0) {
                        pRect(ctx, -r * 0.3, -r * 0.5, 3 * p, p);
                    }
                } else if (enemy.typeKey === 'boss') {
                    // Mega Boss: Dvojitý kanón a červené majáčky
                    ctx.fillStyle = '#B71C1C';
                    pRect(ctx, -r * 0.6, -r * 0.6, r * 1.2, r * 1.2);
                    ctx.fillStyle = '#FF1744';
                    pRect(ctx, r * 0.4, -r * 0.4, 3 * p, 2 * p);
                    pRect(ctx, r * 0.4, r * 0.2, 3 * p, 2 * p);
                }

                ctx.restore();
            }

            // Kreslení babičky Boženy ve stylu 16-bit vintage RPG
            static drawGrandmaStation(ctx, x, y, lives, maxLives, animTime = 0, hurtTimer = 0) {
                ctx.save();
                ctx.translate(Math.floor(x), Math.floor(y));

                // 1. Zásahový záblesk
                if (hurtTimer > 0) {
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.45)';
                    pRect(ctx, -35, -45, 70, 75);
                }

                // 2. Houpací křeslo (vintage pixel rocking chair)
                const rockFrame = Math.floor(Math.sin(animTime * 2.5) * 2);
                ctx.fillStyle = '#5D4037';
                // Lyžiny křesla
                pRect(ctx, -26, 20 + rockFrame, 52, 4);
                pRect(ctx, -24, 24 + rockFrame, 48, 3);
                // Opěradlo
                pRect(ctx, -18, -26 + rockFrame, 6, 44);
                pRect(ctx, -18, -26 + rockFrame, 32, 6);

                // Polstrování sedadla (vínové)
                ctx.fillStyle = '#880E4F';
                pRect(ctx, -14, 2 + rockFrame, 30, 14);

                // 3. Babička Božena:
                // Sukně / tělo
                ctx.fillStyle = '#311B92';
                pRect(ctx, -10, -6 + rockFrame, 22, 22);

                // Pletený šátek přes ramena (levandulový)
                ctx.fillStyle = '#7E57C2';
                pRect(ctx, -12, -18 + rockFrame, 26, 14);
                ctx.fillStyle = '#EDE7F6';
                pRect(ctx, -8, -14 + rockFrame, 18, 4); // Krajka šátku

                // Hlava babičky
                ctx.fillStyle = '#FFCCBC'; // Pleťová
                pRect(ctx, -7, -30 + rockFrame, 16, 14);

                // Růžové tvářičky
                ctx.fillStyle = '#FF8A80';
                pRect(ctx, -6, -23 + rockFrame, 3, 3);
                pRect(ctx, 4, -23 + rockFrame, 3, 3);

                // Šedivé vlasy a drdol
                ctx.fillStyle = '#B0BEC5';
                pRect(ctx, -9, -34 + rockFrame, 20, 6);
                pRect(ctx, -4, -38 + rockFrame, 10, 6); // Drdol
                // Jehla v drdolu
                ctx.fillStyle = '#FFD700';
                pRect(ctx, -7, -36 + rockFrame, 16, 2);

                // Zlaté brýle
                ctx.fillStyle = '#FFD700';
                pRect(ctx, -6, -26 + rockFrame, 5, 4);
                pRect(ctx, 2, -26 + rockFrame, 5, 4);
                pRect(ctx, -1, -25 + rockFrame, 3, 2);
                ctx.fillStyle = '#00E5FF'; // Skla brýlí
                pRect(ctx, -5, -25 + rockFrame, 3, 2);
                pRect(ctx, 3, -25 + rockFrame, 3, 2);

                // 4. Pletací jehlice v rukou (klikají v rytmu)
                const knitTick = Math.floor(animTime * 12) % 2;
                ctx.fillStyle = '#B0BEC5';
                pRect(ctx, 4, -10 + rockFrame + knitTick, 14, 2);
                pRect(ctx, 8, -14 + rockFrame - knitTick, 2, 14);

                // Růžová nit klesající do košíku
                ctx.fillStyle = '#FF4081';

                // Proutěný košík na vlnu vedle křesla

                pRect(ctx, 20, 10, 14, 10);

                // 5. Retro arkádový ukazatel životů nad babičkou
                const hpFrac = lives / maxLives;

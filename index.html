                pRect(ctx, -30, -52 + rockFrame, 60, 8);
                // Výplň životů
                ctx.fillStyle = hpFrac > 0.5 ? '#00E676' : (hpFrac > 0.25 ? '#FFD600' : '#FF1744');
                pRect(ctx, -30, -52 + rockFrame, Math.max(0, Math.floor(60 * hpFrac)), 8);
                // Pixelové srdíčko u lišty
                drawPixelHeart(ctx, -38, -48 + rockFrame, 10, '#FF1744');

                ctx.restore();
            }
        }

        // ─────────────────────────────────────────────
        //  TŘÍDA VĚŽE (TOWER)
        // ─────────────────────────────────────────────
        class Tower {
            constructor(slotIndex, typeId, x, y) {
                this.slotIndex = slotIndex; // -1 pro volně umístěné věže
                this.typeId = typeId;
                this.type = TOWER_TYPES[typeId];
                this.x = x; this.y = y;
                this.level = 0;
                this.totalInvested = this.type.cost;
                this.cooldown = 0;
                this.angle = 0;
                this.kills = 0;
                this.totalDmgDealt = 0;
                this.consecutiveHits = 0;
                this.furyTimer = 0;
                this.lastTargetId = null;
                this.disabledTimer = 0;
                this.buffed = false;
                this.buffMultiplier = 1.0;
                this.rateMultiplier = 1.0;

                // Vizuální efekty
                this.recoil = 0;
                this.spawnAnimScale = 0.2;
                this.animTime = Math.random() * 10;
            }

            get stats() { return this.type.levels[this.level]; }
            get currentDmg() { return this.stats.dmg * this.buffMultiplier; }
            get currentRange() { return this.stats.range; }
            get currentRate() { let r = this.stats.rate * this.rateMultiplier; if (this.furyTimer > 0) r *= 2.0; return r; }
            get nextUpgradeCost() { return this.level >= 2 ? null : this.type.levels[this.level + 1].cost; }
            get sellValue() { return Math.floor(this.totalInvested * 0.6); }

            upgrade() {
                if (this.level < 2) {
                    this.level++;
                    this.totalInvested += this.stats.cost;
                    this.spawnAnimScale = 0.6; // Vylepšovací bounce efekt
                    return true;
                }
                return false;
            }

            update(dt, enemies, projectiles, floatingTexts, audio, paths = null) {
                this.animTime += dt;

                // Bounce efekt po položení
                if (this.spawnAnimScale < 1.0) {
                    this.spawnAnimScale = Math.min(1.0, this.spawnAnimScale + dt * 4.5);
                }

                // Zotavení z recoilu
                if (this.recoil > 0) {
                    this.recoil = Math.max(0, this.recoil - dt * 5.0);
                }

                if (this.disabledTimer > 0) { this.disabledTimer -= dt; return; }
                if (this.furyTimer > 0) this.furyTimer -= dt;
                if (this.typeId === 7) return; // Sfinx má jen auru
                if (this.cooldown > 0) { this.cooldown -= dt; return; }

                // Sardinková konzerva (typeId === 9) - pravidelné vysílání konzervy na trasu
                if (this.typeId === 9) {
                    if (paths && paths.length > 0) {
                        this._shootSardineCan(paths, projectiles, floatingTexts, audio);
                        this.recoil = 1.0;
                        this.cooldown = 1.0 / this.currentRate;
                    }
                    return;
                }

                const target = this._findBestTarget(enemies);
                if (!target) return;

                this.angle = Math.atan2(target.y - this.y, target.x - this.x);
                this._shoot(target, projectiles, floatingTexts, audio);
                this.recoil = 1.0;
                this.cooldown = 1.0 / this.currentRate;
            }

            _shootSardineCan(paths, projectiles, floatingTexts, audio) {
                const stats = this.stats;
                const targetInfo = this._findClosestPathPoint(paths);
                if (!targetInfo || !targetInfo.point) return;

                this.angle = Math.atan2(targetInfo.point.y - this.y, targetInfo.point.x - this.x);
                audio.play('splat');
                projectiles.push(new Projectile(this, null, {
                    type: 'sardine_can',
                    targetX: targetInfo.point.x,
                    targetY: targetInfo.point.y,
                    path: targetInfo.path,
                    segIdx: targetInfo.segIdx,
                    speed: stats.speed,
                    stunDur: stats.stunDur,
                    maxHits: stats.maxHits,
                    dmg: this.currentDmg,
                    color: '#90A4AE'
                }));
            }

            _findClosestPathPoint(paths) {
                let closest = null;
                let minD = Infinity;
                let chosenPath = null;
                let chosenSegIdx = 0;

                for (const p of paths) {
                    for (let i = 0; i < p.length - 1; i++) {
                        const p1 = p[i];
                        const p2 = p[i + 1];
                        const dx = p2.x - p1.x;
                        const dy = p2.y - p1.y;
                        const lenSq = dx * dx + dy * dy;
                        let t = lenSq === 0 ? 0 : ((this.x - p1.x) * dx + (this.y - p1.y) * dy) / lenSq;
                        t = Math.max(0, Math.min(1, t));
                        const projX = p1.x + t * dx;
                        const projY = p1.y + t * dy;
                        const d = dist(this.x, this.y, projX, projY);
                        if (d < minD) {
                            minD = d;
                            closest = { x: projX, y: projY };
                            chosenPath = p;
                            chosenSegIdx = i;
                        }
                    }
                }
                return { point: closest, path: chosenPath, segIdx: chosenSegIdx };
            }

            _findBestTarget(enemies) {
                let best = null, bestProgress = -1;
                const range = this.currentRange;
                for (const e of enemies) {
                    if (e.dead) continue;
                    if (e.typeKey === 'stealth' && !e.revealed && dist(this.x, this.y, e.x, e.y) > 70) continue;
                    const d = dist(this.x, this.y, e.x, e.y);
                    if (d <= range && e.pathProgress > bestProgress) {
                        bestProgress = e.pathProgress;
                        best = e;
                    }
                }
                return best;
            }

            _shoot(target, projectiles, floatingTexts, audio) {
                const stats = this.stats;
                switch (this.typeId) {
                    case 0: // Mourek
                        audio.play('hit');
                        projectiles.push(new Projectile(this, target, { type: 'paw', speed: 390, dmg: this.currentDmg, color: '#FFA500' }));
                        break;
                    case 1: // Micinka
                        audio.play('hit');
                        if (this.lastTargetId === target.id) {
                            this.consecutiveHits++;
                            if (this.consecutiveHits >= stats.furyHits) {
                                this.furyTimer = 2.0;
                                floatingTexts.push(new FloatingText(this.x, this.y - 20, 'ZUŘIVOST! 🔥', '#FF3D00', 14, true));
                                this.consecutiveHits = 0;
                            }
                        } else {
                            this.lastTargetId = target.id;
                            this.consecutiveHits = 1;
                        }
                        projectiles.push(new Projectile(this, target, { type: 'scratch', speed: 650, dmg: this.currentDmg, color: '#FFFFFF' }));
                        break;
                    case 2: // Garfield
                        audio.play('splat');
                        projectiles.push(new Projectile(this, target, {
                            type: 'lasagne', speed: 270, dmg: this.currentDmg, aoe: stats.aoe, slow: stats.slow, arc: true, targetX: target.x, targetY: target.y
                        }));
                        break;
                    case 3: // Perská
                        audio.play('ice');
                        projectiles.push(new Projectile(this, target, {
                            type: 'ice_beam', speed: 750, dmg: this.currentDmg, slow: stats.slow, slowDur: stats.dur, color: '#00E5FF'
                        }));
                        break;
                    case 4: // Siamka
                        audio.play('laser');
                        const isCrit = Math.random() < stats.critChance;
                        const finalDmg = isCrit ? this.currentDmg * 2.0 : this.currentDmg;
                        if (isCrit) {
                            audio.play('crit');
                            floatingTexts.push(new FloatingText(target.x, target.y - 18, 'KRIT! 2× 🎯', '#FFD700', 15, true));
                        }
                        projectiles.push(new Projectile(this, target, { type: 'laser', speed: 9999, dmg: finalDmg, isCrit, color: '#00E5FF' }));
                        break;
                    case 5: // Černá
                        audio.play('poison');
                        projectiles.push(new Projectile(this, target, {
                            type: 'poison_wisp', speed: 330, dmg: this.currentDmg, dot: stats.dot, dotDur: stats.dotDur, spread: stats.spread, color: '#B388FF'
                        }));
                        break;
                    case 6: // Mainská
                        audio.play('stun');
                        const isStun = Math.random() < stats.stunChance;
                        let stunTime = isStun ? stats.stunDur : 0;
                        if (target.typeKey === 'dyson') stunTime = 0;
                        if (target.typeKey === 'boss') stunTime *= 0.5;
                        projectiles.push(new Projectile(this, target, { type: 'heavy_paw', speed: 560, dmg: this.currentDmg, stunDur: stunTime, color: '#8B4513' }));
                        break;
                    case 8: // Klubíčko
                        audio.play('hit');
                        projectiles.push(new Projectile(this, target, {
                            type: 'yarn_ball',
                            speed: 420,
                            dmg: this.currentDmg,
                            aoe: stats.aoe || 0,
                            color: '#E91E63'
                        }));
                        break;
                }
            }

            render(ctx) {
                const scale = easeOutBack(this.spawnAnimScale);
                Sprites.drawCatTower(ctx, this.x, this.y, this.typeId, this.level, {
                    angle: this.angle,
                    disabled: this.disabledTimer > 0,
                    buffed: this.buffed,
                    fury: this.furyTimer > 0,
                    recoil: this.recoil,
                    scale: scale,
                    animTime: this.animTime
                });

                // Vizuální aura Sfinx
                if (this.typeId === 7) {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(255, 105, 180, 0.45)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 6]);
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.currentRange, 0, Math.PI * 2);
                    ctx.stroke();

                    // Rotující magické runy kolem Sfinx
                    const glyphAngle = this.animTime * 0.8;
                    for (let g = 0; g < 4; g++) {
                        const ga = glyphAngle + (g * Math.PI) / 2;
                        const gx = this.x + Math.cos(ga) * (this.currentRange * 0.85);
                        const gy = this.y + Math.sin(ga) * (this.currentRange * 0.85);
                        ctx.fillStyle = 'rgba(0, 255, 255, 0.6)';
                        ctx.font = '12px Arial';
                        ctx.fillText('✦', gx, gy);
                    }
                    ctx.restore();
                }
            }
        }

        // ─────────────────────────────────────────────
        //  TŘÍDA NEPŘÍTELE (ENEMY)
        // ─────────────────────────────────────────────
        let enemyIdCounter = 1;

        class Enemy {
            constructor(typeKey, path, speedMultiplier = 1.0, hpMultiplier = 1.0) {
                this.id = enemyIdCounter++;
                this.typeKey = typeKey;
                this.data = ENEMY_TYPES[typeKey];
                this.path = path;
                this.maxHp = this.data.hp * hpMultiplier;
                this.hp = this.maxHp;
                this.baseSpeed = this.data.speed * speedMultiplier;
                this.speed = this.baseSpeed;
                this.radius = this.data.radius;
                this.bounty = this.data.bounty;
                this.dmgToGrandma = this.data.dmgToGrandma;

                this.currentWaypoint = 0;
                this.x = path[0].x; this.y = path[0].y;
                this.angle = 0;
                this.pathProgress = 0;

                this.slowTimer = 0; this.slowFactor = 0;
                this.stunTimer = 0;
                this.poisonTimer = 0; this.poisonDmg = 0; this.poisonTickTimer = 0;
                this.revealed = false;
                this.empCooldown = 5.0;
                this.turboTimer = typeKey === 'turbo' ? 2.5 : 0;
                this.animTime = 0;
                this.dead = false;
                this.reachedEnd = false;
                this.hitFlashTimer = 0;
            }

            takeDamage(amount, isPoison = false) {
                let actualDmg = amount;
                if (!isPoison && this.data.armor) actualDmg *= (1.0 - this.data.armor);
                this.hp -= actualDmg;
                this.hitFlashTimer = 0.08;
                if (this.hp <= 0) { this.hp = 0; this.dead = true; }
                return actualDmg;
            }

            applySlow(factor, duration) {
                if (this.typeKey === 'dyson') factor *= 0.5;
                if (factor > this.slowFactor || this.slowTimer <= 0) {
                    this.slowFactor = factor;
                    this.slowTimer = duration;
                }
            }

            applyStun(duration) {
                if (duration > 0 && this.typeKey !== 'dyson') {
                    this.stunTimer = Math.max(this.stunTimer, duration);
                }
            }

            applyPoison(dotDmg, duration) {
                this.poisonDmg = Math.max(this.poisonDmg, dotDmg);
                this.poisonTimer = Math.max(this.poisonTimer, duration);
            }

            update(dt, towers, floatingTexts, audio, particles) {
                this.animTime += dt;
                if (this.hitFlashTimer > 0) this.hitFlashTimer -= dt;

                // Prachové částečky za koly
                if (Math.random() < 0.25) {
                    particles.emitDust(this.x, this.y, 1);
                }

                // Regenerace Bosse
                if (this.data.regen && this.hp < this.maxHp) {
                    this.hp = Math.min(this.maxHp, this.hp + this.data.regen * dt);
                }

                // Jedové DoT
                if (this.poisonTimer > 0) {
                    this.poisonTimer -= dt;
                    this.poisonTickTimer += dt;
                    if (this.poisonTickTimer >= 0.5) {
                        this.poisonTickTimer = 0;
                        const dealt = this.takeDamage(this.poisonDmg * 0.5, true);
                        floatingTexts.push(new FloatingText(this.x, this.y - 12, `-${Math.round(dealt)}`, '#B388FF', 12));
                        if (this.dead) return;
                    }
                }

                // Omráčení
                if (this.stunTimer > 0) {
                    this.stunTimer -= dt;
                    return;
                }

                // Rychlost
                let currentSpeed = this.baseSpeed;
                if (this.turboTimer > 0) {
                    this.turboTimer -= dt;
                    currentSpeed *= 1.8;
                    particles.emit(this.x, this.y, 1, { color: '#FFD700', size: 2, life: 0.3 });
                }
                if (this.slowTimer > 0) {
                    this.slowTimer -= dt;
                    currentSpeed *= (1.0 - this.slowFactor);
                }

                // EMP výboj
                if (this.typeKey === 'emp') {
                    this.empCooldown -= dt;
                    if (this.empCooldown <= 0) {
                        this.empCooldown = 6.0;
                        audio.play('emp');
                        particles.emitExplosion(this.x, this.y, '#00E5FF', 22);
                        for (const t of towers) {
                            if (t.typeId !== 7 && dist(this.x, this.y, t.x, t.y) <= 85) {
                                t.disabledTimer = 2.0;
                                floatingTexts.push(new FloatingText(t.x, t.y - 20, '⚡ EMP!', '#FFD700', 13, true));
                            }
                        }
                    }
                }

                // Pohyb mezi waypointy
                const targetWp = this.path[this.currentWaypoint + 1];
                if (!targetWp) { this.reachedEnd = true; return; }

                const dx = targetWp.x - this.x, dy = targetWp.y - this.y;
                const d = Math.sqrt(dx * dx + dy * dy);
                const step = currentSpeed * dt;

                this.angle = Math.atan2(dy, dx);

                if (d <= step) {
                    this.x = targetWp.x; this.y = targetWp.y;
                    this.currentWaypoint++;
                    this.pathProgress += d;
                    if (this.currentWaypoint >= this.path.length - 1) this.reachedEnd = true;
                } else {
                    this.x += (dx / d) * step;
                    this.y += (dy / d) * step;
                    this.pathProgress += step;
                }
            }

            render(ctx) { Sprites.drawEnemy(ctx, this); }
        }

        // ─────────────────────────────────────────────
        //  TŘÍDA PROJEKTILU (PROJECTILE)
        // ─────────────────────────────────────────────
        class Projectile {
            constructor(sourceTower, targetEnemy, opts = {}) {
                this.source = sourceTower;
                this.target = targetEnemy;
                this.type = opts.type;
                this.x = sourceTower.x; this.y = sourceTower.y;
                this.speed = opts.speed || 400;
                this.dmg = opts.dmg || 10;
                this.color = opts.color || '#FFF';
                this.aoe = opts.aoe || 0;
                this.slow = opts.slow || 0; this.slowDur = opts.slowDur || 0;
                this.stunDur = opts.stunDur || 0;
                this.dot = opts.dot || 0; this.dotDur = opts.dotDur || 0;
                this.spread = opts.spread || false;
                this.isCrit = opts.isCrit || false;
                this.dead = false;
                this.targetX = opts.targetX || (targetEnemy ? targetEnemy.x : this.x);
                this.targetY = opts.targetY || (targetEnemy ? targetEnemy.y : this.y);
                this.arc = opts.arc || false;
                this.startX = this.x; this.startY = this.y;
                this.totalDist = dist(this.startX, this.startY, this.targetX, this.targetY);
                this.traveled = 0;

                // Speciální vlastnosti pro Klubíčko & Sardinku
                this.animTime = 0;
                this.spinAngle = 0;
                this.trail = [];
                this.maxHits = opts.maxHits || 5;
                this.hitsLeft = this.maxHits;
                this.hitEnemies = new Set();
                this.path = opts.path || null;
                this.segIdx = opts.segIdx !== undefined ? opts.segIdx : 0;
                this.phase = opts.type === 'sardine_can' ? 'flying_to_path' : 'normal';
                this.lifeTime = opts.type === 'sardine_can' ? 12.0 : 6.0;
                this.angle = 0;
                this.nextWpIdx = this.segIdx;
            }

            update(dt, enemies, groundPuddles, particles, floatingTexts) {
                this.animTime += dt;

                // 1. Sardinková konzerva - speciální chování po trase
                if (this.type === 'sardine_can') {
                    this.lifeTime -= dt;
                    if (this.lifeTime <= 0) {
                        this.dead = true;
                        return;
                    }

                    if (this.phase === 'flying_to_path') {
                        const dx = this.targetX - this.x;
                        const dy = this.targetY - this.y;
                        const d = Math.sqrt(dx * dx + dy * dy);
                        const step = this.speed * dt;
                        this.angle = Math.atan2(dy, dx);

                        if (d <= step) {
                            this.x = this.targetX;
                            this.y = this.targetY;
                            this.phase = 'on_path';
                            this.nextWpIdx = this.segIdx; // Pohyb po trase směrem k začátku (proti vysavačům)
                            particles.emit(this.x, this.y, 4, { color: '#90A4AE', size: 2.5, life: 0.3 });
                        } else {
                            this.x += (dx / d) * step;
                            this.y += (dy / d) * step;
                        }
                    } else if (this.phase === 'on_path') {
                        if (!this.path || this.nextWpIdx < 0 || this.nextWpIdx >= this.path.length) {
                            this.dead = true;
                            return;
                        }

                        const targetWp = this.path[this.nextWpIdx];
                        const dx = targetWp.x - this.x;
                        const dy = targetWp.y - this.y;
                        const d = Math.sqrt(dx * dx + dy * dy);
                        const step = this.speed * dt;
                        this.angle = Math.atan2(dy, dx);

                        if (d <= step) {
                            this.x = targetWp.x;
                            this.y = targetWp.y;
                            this.nextWpIdx--;
                            if (this.nextWpIdx < 0) {
                                // Dojela až na začátek trasy
                                this.dead = true;
                                particles.emitDust(this.x, this.y, 3);
                                return;
                            }
                        } else {
                            this.x += (dx / d) * step;
                            this.y += (dy / d) * step;
                        }

                        // Detekce zásahu vysavačů podél trasy
                        for (const e of enemies) {
                            if (e.dead || this.hitEnemies.has(e.id)) continue;
                            if (dist(this.x, this.y, e.x, e.y) <= e.radius + 15) {
                                this.hitEnemies.add(e.id);
                                e.applyStun(this.stunDur);
                                const dealt = e.takeDamage(this.dmg);
                                this.source.totalDmgDealt += dealt;
                                this.hitsLeft--;

                                floatingTexts.push(new FloatingText(e.x, e.y - 14, `STOP! ${this.stunDur}s 🥫`, '#FFB300', 13, true));
                                particles.emit(e.x, e.y, 7, { color: '#00E5FF', size: 3, life: 0.5 });
                                particles.emit(e.x, e.y, 5, { color: '#FFD700', size: 4, life: 0.6, shape: 'star' });

                                if (this.hitsLeft <= 0) {
                                    this.dead = true;
                                    particles.emitExplosion(this.x, this.y, '#90A4AE', 16);
                                    floatingTexts.push(new FloatingText(this.x, this.y - 18, 'PRÁZDNÁ KONZERVA! 💥', '#ECEFF1', 13));
                                    return;
                                }
                            }
                        }
                    }
                    return;
                }

                // 2. Kočičí klubíčko - rotace a stopa příze
                if (this.type === 'yarn_ball') {
                    this.spinAngle += dt * 14;
                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > 12) this.trail.shift();

                    const destX = this.target.dead ? this.targetX : this.target.x;
                    const destY = this.target.dead ? this.targetY : this.target.y;
                    const dx = destX - this.x, dy = destY - this.y;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    const step = this.speed * dt;

                    if (d <= step) {
                        this.x = destX; this.y = destY;
                        this._onImpact(enemies, groundPuddles, particles, floatingTexts);
                        this.dead = true;
                    } else {
                        this.x += (dx / d) * step;
                        this.y += (dy / d) * step;
                        this.traveled += step;
                    }
                    return;
                }

                if (this.type === 'laser') {
                    this._hitEnemy(this.target, enemies, groundPuddles, particles, floatingTexts);
                    this.dead = true;
                    return;
                }

                const destX = this.arc ? this.targetX : (this.target.dead ? this.targetX : this.target.x);
                const destY = this.arc ? this.targetY : (this.target.dead ? this.targetY : this.target.y);
                const dx = destX - this.x, dy = destY - this.y;
                const d = Math.sqrt(dx * dx + dy * dy);
                const step = this.speed * dt;

                if (d <= step) {
                    this.x = destX; this.y = destY;
                    this._onImpact(enemies, groundPuddles, particles, floatingTexts);
                    this.dead = true;
                } else {
                    this.x += (dx / d) * step;
                    this.y += (dy / d) * step;
                    this.traveled += step;
                }
            }

            _onImpact(enemies, groundPuddles, particles, floatingTexts) {
                if (this.type === 'lasagne') {
                    particles.emitExplosion(this.x, this.y, '#FF5722', 20);
                    groundPuddles.push({
                        x: this.x, y: this.y, radius: this.aoe, slow: this.slow, timer: 1.8, maxTimer: 1.8
                    });
                    for (const e of enemies) {
                        if (!e.dead && dist(this.x, this.y, e.x, e.y) <= this.aoe) {
                            this._hitEnemy(e, enemies, groundPuddles, particles, floatingTexts);
                        }
                    }
                } else if (this.type === 'yarn_ball') {
                    // Hlavní cíl
                    if (!this.target.dead) {
                        this._hitEnemy(this.target, enemies, groundPuddles, particles, floatingTexts);
                    }
                    // Efekty zásahu klubíčkem
                    particles.emitExplosion(this.x, this.y, '#E91E63', 14);
                    particles.emit(this.x, this.y, 8, { color: '#FF80AB', size: 3.5, life: 0.55 });
                    particles.emit(this.x, this.y, 5, { color: '#FFD54F', size: 2.5, life: 0.45 });

                    // Lvl 3 Plošné poškození okolním vysavačům
                    if (this.aoe > 0) {
                        particles.emitExplosion(this.x, this.y, '#AD1457', 16);
                        for (const e of enemies) {
                            if (e !== this.target && !e.dead && dist(this.x, this.y, e.x, e.y) <= this.aoe) {
                                const splash = e.takeDamage(this.dmg * 0.55);
                                this.source.totalDmgDealt += splash;
                                floatingTexts.push(new FloatingText(e.x, e.y - 10, `-${Math.round(splash)}`, '#FF80AB', 12));
                                particles.emit(e.x, e.y, 4, { color: '#F48FB1', size: 3, life: 0.4 });
                                if (e.dead) this.source.kills++;
                            }
                        }
                    }
                } else {
                    if (!this.target.dead) {
                        this._hitEnemy(this.target, enemies, groundPuddles, particles, floatingTexts);
                    }
                }
            }

            _hitEnemy(enemy, enemies, groundPuddles, particles, floatingTexts) {
                const dealt = enemy.takeDamage(this.dmg);
                this.source.totalDmgDealt += dealt;
                const textColor = this.isCrit ? '#FFD700' : (this.type === 'ice_beam' ? '#00E5FF' : (this.type === 'yarn_ball' ? '#FF80AB' : '#FFFFFF'));
                floatingTexts.push(new FloatingText(enemy.x, enemy.y - 10, `-${Math.round(dealt)}`, textColor, this.isCrit ? 16 : 13, this.isCrit));
                particles.emitExplosion(enemy.x, enemy.y, this.color, 7);

                if (this.slow > 0) enemy.applySlow(this.slow, this.slowDur || 2.0);
                if (this.stunDur > 0) enemy.applyStun(this.stunDur);
                if (this.dot > 0) {
                    enemy.applyPoison(this.dot, this.dotDur);
                    if (this.spread) {
                        for (const other of enemies) {
                            if (other !== enemy && !other.dead && dist(enemy.x, enemy.y, other.x, other.y) <= 45) {
                                other.applyPoison(this.dot * 0.7, this.dotDur);
                            }
                        }
                    }
                }
                if (enemy.dead) this.source.kills++;
            }

            render(ctx) {
                ctx.save();
                if (this.type === 'laser') {
                    ctx.strokeStyle = this.isCrit ? '#FFD700' : '#00E5FF';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(Math.floor(this.source.x), Math.floor(this.source.y));
                    ctx.lineTo(Math.floor(this.target.x), Math.floor(this.target.y));
                    ctx.stroke();
                    // Pixelové jiskry podél paprsku
                    for (let s = 0.2; s <= 0.8; s += 0.2) {
                        const px = lerp(this.source.x, this.target.x, s);
                        const py = lerp(this.source.y, this.target.y, s);
                        pRect(ctx, px - 2, py - 2, 4, 4, '#FFFFFF');
                    }
                } else if (this.type === 'yarn_ball') {
                    // 1. Pixelová stopa odvíjející se příze
                    if (this.trail.length > 1) {
                        ctx.fillStyle = '#E91E63';
                        for (let i = 0; i < this.trail.length; i += 2) {
                            const pt = this.trail[i];
                            pRect(ctx, pt.x - 1, pt.y - 1, 3, 3);
                        }
                    }

                    // 2. Rotující 16-bit pixelové klubíčko
                    ctx.save();
                    ctx.translate(Math.floor(this.x), Math.floor(this.y));
                    ctx.rotate(this.spinAngle);
                    drawPixelYarn(ctx, 0, 0, 16, '#E91E63');
                    if (this.aoe > 0) {
                        ctx.strokeStyle = '#FF4081';
                        ctx.lineWidth = 2;
                        const aoeP = Math.floor(Math.sin(this.animTime * 14) * 3);
                        ctx.strokeRect(-12 - aoeP, -12 - aoeP, 24 + aoeP * 2, 24 + aoeP * 2);
                    }
                    ctx.restore();

                } else if (this.type === 'sardine_can') {
                    // 16-bit pixelová sardinková konzerva jedoucí po trase
                    ctx.save();
                    ctx.translate(Math.floor(this.x), Math.floor(this.y));
                    ctx.rotate(this.angle || 0);

                    drawPixelCan(ctx, 0, 0, 0, 24);

                    // Počítadlo zásahů (pixelový odznak)
                    pBox(ctx, -10, -22, 20, 12, '#FF6D00', '#FFF', '#FFA000', '#D84315');
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = '8px "Press Start 2P", monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(`${this.hitsLeft}`, 0, -16);
                    ctx.restore();

                } else if (this.type === 'claws') {
                    // Pixelové drápy (tři šikmé čtverečkované šrámy)
                    ctx.save();
                    ctx.translate(Math.floor(this.x), Math.floor(this.y));
                    ctx.fillStyle = this.color || '#FFF';
                    [-4, 0, 4].forEach(off => {
                        pRect(ctx, off - 3, -3, 2, 2);
                        pRect(ctx, off - 1, -1, 2, 2);
                        pRect(ctx, off + 1, 1, 2, 2);
                        pRect(ctx, off + 3, 3, 2, 2);
                    });
                    ctx.restore();

                } else if (this.type === 'lasagna') {
                    // Pixelový řez lasagní
                    ctx.save();
                    ctx.translate(Math.floor(this.x), Math.floor(this.y));
                    pBox(ctx, -7, -7, 14, 14, '#FF9800', '#D84315', '#FFE082', '#BF360C');
                    pRect(ctx, -4, -4, 8, 3, '#D32F2F'); // Rajčatová omáčka
                    pRect(ctx, -4, 0, 8, 3, '#FFF9C4');  // Sýr
                    ctx.restore();

                } else {
                    // Standardní pixelový projektil
                    pBox(ctx, this.x - 4, this.y - 4, 8, 8, this.color, '#000', '#FFF', '#333');
                }
                ctx.restore();
            }
        }

        // ─────────────────────────────────────────────
        //  HLAVNÍ HERNÍ OBRAZOVKA (GAME SCREEN)
        // ─────────────────────────────────────────────
        class GameScreen {
            constructor(game, mapId) {
                this.game = game;
                this.mapId = mapId;
                this.config = MAP_CONFIGS[mapId];

                this.lives = this.config.startLives;
                this.maxLives = this.config.startLives;
                this.yarn = this.config.startYarn;

                this.currentWave = 0;
                this.totalWaves = this.config.waves;
                this.waveInProgress = false;
                this.waveCompleted = false;
                this.spawnQueue = [];
                this.spawnTimer = 0;

                this.towers = [];
                this.enemies = [];
                this.projectiles = [];
                this.groundPuddles = [];
                this.particles = new ParticleSystem();
                this.floatingTexts = [];

                this.selectedShopCat = null;
                this.selectedTower = null;
                this.hoveredSlot = null;
                this.hoveredShopCat = null;
                this.hoveredHudBtn = null;
                this.mouseX = -999;
                this.mouseY = -999;

                this.gameSpeed = 1.0;
                this.paused = false;

                this.isVictory = false;
                this.isGameOver = false;

                this.bannerText = null;
                this.bannerTimer = 0;
                this.animTime = 0;
                this.grandmaHurtTimer = 0;

                this.totalEarned = this.config.startYarn;
                this.totalKillsAll = 0;

                this.slots = this.config.buildSlots.map((s, idx) => ({ id: idx, x: s.x, y: s.y, tower: null }));

                // Spustit hudbu hry
                this.game.audio.setTrack('game');
            }

            update(dt) {
                this.animTime += dt;
                if (this.grandmaHurtTimer > 0) this.grandmaHurtTimer -= dt;
                this.game.audio.updateMusic();
                this.game.audio.updateMotorHum(this.enemies.length);

                if (this.paused || this.isVictory || this.isGameOver) return;

                const eDt = dt * this.gameSpeed;

                if (this.bannerTimer > 0) {
                    this.bannerTimer -= eDt;
                    if (this.bannerTimer <= 0) this.bannerText = null;
                }

                // Spawning vln
                if (this.waveInProgress) {
                    this.spawnTimer -= eDt;
                    if (this.spawnTimer <= 0 && this.spawnQueue.length > 0) {
                        const item = this.spawnQueue.shift();
                        this._spawnEnemy(item.typeKey, item.pathIndex);
                        this.spawnTimer = item.delay || 0.85;
                    }
                    if (this.spawnQueue.length === 0 && this.enemies.length === 0) {
                        this._onWaveCleared();
                    }
                }

                // Louže (Garfield)
                for (const puddle of this.groundPuddles) {
                    puddle.timer -= eDt;
                    for (const e of this.enemies) {
                        if (!e.dead && dist(puddle.x, puddle.y, e.x, e.y) <= puddle.radius) {
                            e.applySlow(puddle.slow, 0.4);
                        }
                    }
                }
                this.groundPuddles = this.groundPuddles.filter(p => p.timer > 0);

                // Aury
                this._updateSphinxAuras();

                // Entity
                for (const t of this.towers) t.update(eDt, this.enemies, this.projectiles, this.floatingTexts, this.game.audio, this.config.paths);
                for (const p of this.projectiles) p.update(eDt, this.enemies, this.groundPuddles, this.particles, this.floatingTexts);
                this.projectiles = this.projectiles.filter(p => !p.dead);

                for (const e of this.enemies) {
                    e.update(eDt, this.towers, this.floatingTexts, this.game.audio, this.particles);

                    if (e.reachedEnd) {
                        this.lives = Math.max(0, this.lives - e.dmgToGrandma);
                        this.grandmaHurtTimer = 0.55;
                        this.game.audio.play('hurt');
                        this.floatingTexts.push(new FloatingText(this.config.grandmaPos.x, this.config.grandmaPos.y - 35, `-${e.dmgToGrandma} ❤️`, '#FF1744', 18, true));
                        e.dead = true;
                        if (this.lives <= 0) this._onGameOver();
                    } else if (e.dead) {
                        this.yarn += e.bounty;
                        this.totalEarned += e.bounty;
                        this.totalKillsAll++;
                        this.game.audio.play('die');
                        this.particles.emitExplosion(e.x, e.y, '#FFD700', 12);
                        this.floatingTexts.push(new FloatingText(e.x, e.y - 15, `+${e.bounty} 🧶`, '#FFD700', 13));
                    }
                }
                this.enemies = this.enemies.filter(e => !e.dead);

                this.particles.update(eDt);
                for (const ft of this.floatingTexts) ft.update(eDt);
                this.floatingTexts = this.floatingTexts.filter(ft => !ft.dead);
            }

            // ─────────────────────────────────────────────
            //  VALIDACE POZICE VĚŽE
            // ─────────────────────────────────────────────

            // Vrátí nejmenší vzdálenost bodu od úsečky (line segment)
            _pointToSegmentDist(px, py, ax, ay, bx, by) {
                const dx = bx - ax, dy = by - ay;
                const lenSq = dx * dx + dy * dy;
                if (lenSq === 0) return dist(px, py, ax, ay);
                const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / lenSq));
                return dist(px, py, ax + t * dx, ay + t * dy);
            }

            // Zkontroluje, zda je bod příliš blízko k cestě vysavačů
            _isOnPath(x, y, margin = 30) {
                for (const path of this.config.paths) {
                    for (let i = 0; i < path.length - 1; i++) {
                        const d = this._pointToSegmentDist(x, y, path[i].x, path[i].y, path[i+1].x, path[i+1].y);
                        if (d < margin) return true;
                    }
                    // Také zkontroluj waypointy samotné
                    for (const wp of path) {
                        if (dist(x, y, wp.x, wp.y) < margin) return true;
                    }
                }
                return false;
            }

            // Zkontroluje, zda se věž překrývá s jinou existující věží
            _overlapsExistingTower(x, y, minDist = 44) {
                return this.towers.some(t => dist(x, y, t.x, t.y) < minDist);
            }

            // Zkontroluje, zda je pozice v rámci herní plochy
            _isInPlayArea(x, y, margin = 28) {
                return x >= margin && x <= W - margin && y >= PLAY_TOP + margin && y <= PLAY_BOTTOM - margin;
            }

            // Zkontroluje, zda je pozice platná pro umístění věže
            _isValidPlacement(x, y) {
                if (!this._isInPlayArea(x, y)) return false;
                if (this._isOnPath(x, y)) return false;
                if (this._overlapsExistingTower(x, y)) return false;
                return true;
            }

            _updateSphinxAuras() {                for (const t of this.towers) { t.buffed = false; t.buffMultiplier = 1.0; t.rateMultiplier = 1.0; }
                for (const e of this.enemies) e.revealed = false;

                for (const sfinx of this.towers) {
                    if (sfinx.typeId !== 7 || sfinx.disabledTimer > 0) continue;
                    const stats = sfinx.stats;
                    for (const other of this.towers) {
                        if (other === sfinx) continue;
                        if (dist(sfinx.x, sfinx.y, other.x, other.y) <= sfinx.currentRange) {
                            other.buffed = true;
                            other.buffMultiplier = Math.max(other.buffMultiplier, 1.0 + stats.buff);
                            if (stats.rateBuff) other.rateMultiplier = Math.max(other.rateMultiplier, 1.0 + stats.rateBuff);
                        }
                    }
                    for (const e of this.enemies) {
                        if (e.typeKey === 'stealth' && dist(sfinx.x, sfinx.y, e.x, e.y) <= sfinx.currentRange) {
                            e.revealed = true;
                        }
                    }
                }
            }

            _spawnEnemy(typeKey, pathIndex = 0) {
                const path = this.config.paths[pathIndex % this.config.paths.length];
                const hpScale = 1.0 + (this.currentWave - 1) * 0.08;
                this.enemies.push(new Enemy(typeKey, path, 1.0, hpScale));
            }

            startNextWave() {
                if (this.waveInProgress || this.currentWave >= this.totalWaves) return;
                this.currentWave++;
                this.waveInProgress = true;
                this.waveCompleted = false;
                this.game.audio.play('wave');
                this.spawnQueue = this._generateWaveQueue(this.currentWave);
                this.spawnTimer = 0.25;

                const newType = this._checkNewEnemyType(this.currentWave);
                if (newType) {
                    this.bannerText = `⚠️ POZOR: Přichází ${newType}!`;
                    this.bannerTimer = 4.0;
                }
            }

            _generateWaveQueue(wave) {
                const queue = [];
                const mp = this.config.paths.length;
                const p = (i) => i % mp;

                if (wave === 1) { for (let i = 0; i < 5; i++) queue.push({ typeKey: 'basic', pathIndex: p(i), delay: 0.9 }); }
                else if (wave === 2) { for (let i = 0; i < 8; i++) queue.push({ typeKey: 'basic', pathIndex: p(i), delay: 0.8 }); }
                else if (wave === 3) {
                    for (let i = 0; i < 6; i++) queue.push({ typeKey: 'basic', pathIndex: 0, delay: 0.75 });
                    for (let i = 0; i < 6; i++) queue.push({ typeKey: 'mini', pathIndex: p(i), delay: 0.38 });
                } else if (wave === 4) {
                    for (let i = 0; i < 5; i++) queue.push({ typeKey: 'turbo', pathIndex: p(i), delay: 0.65 });
                    for (let i = 0; i < 4; i++) queue.push({ typeKey: 'basic', pathIndex: 0, delay: 0.75 });
                } else if (wave === 5) {
                    for (let i = 0; i < 6; i++) queue.push({ typeKey: 'basic', pathIndex: 0, delay: 0.75 });
                    queue.push({ typeKey: 'boss', pathIndex: 0, delay: 1.5 });
                    for (let i = 0; i < 4; i++) queue.push({ typeKey: 'turbo', pathIndex: p(i), delay: 0.55 });
                } else if (wave === 6) {
                    for (let i = 0; i < 4; i++) queue.push({ typeKey: 'stealth', pathIndex: p(i), delay: 0.95 });
                    for (let i = 0; i < 6; i++) queue.push({ typeKey: 'basic', pathIndex: 0, delay: 0.65 });
                } else if (wave === 7) {
                    for (let i = 0; i < 3; i++) queue.push({ typeKey: 'industrial', pathIndex: p(i), delay: 1.3 });
                    for (let i = 0; i < 10; i++) queue.push({ typeKey: 'mini', pathIndex: 0, delay: 0.32 });
                } else if (wave === 8) {
                    for (let i = 0; i < 4; i++) queue.push({ typeKey: 'emp', pathIndex: p(i), delay: 1.1 });
                    for (let i = 0; i < 5; i++) queue.push({ typeKey: 'turbo', pathIndex: 0, delay: 0.65 });
                } else if (wave === 9) {
                    for (let i = 0; i < 4; i++) queue.push({ typeKey: 'dyson', pathIndex: p(i), delay: 0.85 });
                    for (let i = 0; i < 4; i++) queue.push({ typeKey: 'stealth', pathIndex: 0, delay: 0.95 });
                    for (let i = 0; i < 3; i++) queue.push({ typeKey: 'industrial', pathIndex: p(i), delay: 1.2 });
                } else if (wave === 10) {
                    for (let i = 0; i < 6; i++) queue.push({ typeKey: 'turbo', pathIndex: p(i), delay: 0.55 });
                    for (let i = 0; i < 4; i++) queue.push({ typeKey: 'dyson', pathIndex: 0, delay: 0.75 });
                    for (let i = 0; i < 3; i++) queue.push({ typeKey: 'industrial', pathIndex: p(i), delay: 1.1 });
                    queue.push({ typeKey: 'boss', pathIndex: 0, delay: 1.8 });
                    for (let i = 0; i < 8; i++) queue.push({ typeKey: 'mini', pathIndex: p(i), delay: 0.28 });
                } else if (wave % 5 === 0) {
                    for (let i = 0; i < 8; i++) queue.push({ typeKey: 'turbo', pathIndex: p(i), delay: 0.5 });
                    for (let i = 0; i < 3; i++) queue.push({ typeKey: 'emp', pathIndex: p(i), delay: 0.95 });
                    for (let i = 0; i < 2; i++) queue.push({ typeKey: 'boss', pathIndex: p(i), delay: 2.5 });
                    for (let i = 0; i < 6; i++) queue.push({ typeKey: 'mini', pathIndex: p(i), delay: 0.28 });
                } else {
                    const extra = Math.floor(wave / 3);
                    for (let i = 0; i < 4 + extra; i++) queue.push({ typeKey: 'turbo', pathIndex: p(i), delay: 0.55 });
                    for (let i = 0; i < 2 + extra; i++) queue.push({ typeKey: 'dyson', pathIndex: 0, delay: 0.75 });
                    for (let i = 0; i < 2; i++) queue.push({ typeKey: 'industrial', pathIndex: p(i), delay: 1.1 });
                    if (wave >= 12) for (let i = 0; i < 3; i++) queue.push({ typeKey: 'stealth', pathIndex: p(i), delay: 0.85 });
                    if (wave >= 14) for (let i = 0; i < 2; i++) queue.push({ typeKey: 'emp', pathIndex: 0, delay: 1.0 });
                    for (let i = 0; i < 4 + extra; i++) queue.push({ typeKey: 'mini', pathIndex: p(i), delay: 0.28 });
                }
                return queue;
            }

            _checkNewEnemyType(wave) {
                if (wave === 1) return 'Roomba Basic';
                if (wave === 3) return 'Mini vysavač (Swarm)';
                if (wave === 4) return 'Roomba Turbo (Rychlík)';
                if (wave === 5) return 'BOSS: Mega Vysavač 3000!';
                if (wave === 6) return 'Stealth Roomba (Použij Sfinx!)';
                if (wave === 7) return 'Průmyslový vysavač (Obrněný tank)';
                if (wave === 8) return 'EMP vysavač (Deaktivuje kočky)';
                if (wave === 9) return 'Létající Dyson (Imunní na pasti)';
                return null;
            }

            _onWaveCleared() {
                this.waveInProgress = false;
                this.waveCompleted = true;
                const waveBonus = 30 + this.mapId * 10;
                this.yarn += waveBonus;
                this.totalEarned += waveBonus;
                this.game.audio.play('upgrade');
                this.floatingTexts.push(new FloatingText(W / 2, H / 2 - 40, `VLNA ${this.currentWave} DOKONČENA! +${waveBonus} 🧶`, '#FFD700', 22, true));
                if (this.currentWave >= this.totalWaves) this._onVictory();
            }

            _onVictory() {
                this.isVictory = true;
                this.game.audio.play('win');
                this.particles.emitConfetti(70);
                if (this.mapId + 1 < MAP_CONFIGS.length) unlockedMaps[this.mapId + 1] = true;
            }

            _onGameOver() {
                this.isGameOver = true;
                this.game.audio.play('lose');
            }

            // ─────────────────────────────────────────────
            //  RENDEROVÁNÍ HERNÍHO SVĚTA
            // ─────────────────────────────────────────────
            render(ctx) {
                this._renderBackground(ctx);
                this._renderDecorations(ctx);
                this._renderPaths(ctx);

                // Louže (Garfield)
                for (const puddle of this.groundPuddles) {
                    ctx.save();
                    const alpha = puddle.timer / puddle.maxTimer;
                    ctx.fillStyle = `rgba(230, 74, 25, ${0.45 * alpha})`;
                    ctx.beginPath(); ctx.arc(puddle.x, puddle.y, puddle.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#D84315'; ctx.lineWidth = 2; ctx.stroke();
                    // Bubliny v omáčce
                    ctx.fillStyle = '#FFD54F';
                    ctx.beginPath();
                    ctx.arc(puddle.x + Math.sin(this.animTime * 5) * 8, puddle.y + Math.cos(this.animTime * 5) * 6, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                this._renderBuildSlots(ctx);
                Sprites.drawGrandmaStation(ctx, this.config.grandmaPos.x, this.config.grandmaPos.y, this.lives, this.maxLives, this.animTime, this.grandmaHurtTimer);

                for (const t of this.towers) t.render(ctx);
                for (const e of this.enemies) e.render(ctx);
                for (const p of this.projectiles) p.render(ctx);

                this.particles.render(ctx);
                for (const ft of this.floatingTexts) ft.render(ctx);

                this._renderPlacementPreview(ctx);

                if (this.selectedTower) this._renderTowerMenu(ctx);
                if (this.bannerText) this._renderBanner(ctx);

                this._renderTopHUD(ctx);
                this._renderShopPanel(ctx);

                if (this.paused && !this.isVictory && !this.isGameOver) this._renderPauseOverlay(ctx);
                if (this.isVictory) this._renderVictoryModal(ctx);
                if (this.isGameOver) this._renderGameOverModal(ctx);
            }

            _renderBackground(ctx) {
                ctx.save();
                const tileSize = 32; // Klasická 32x32 pixelová mřížka (vintage čtverečky)

                if (this.config.theme === 'living') {
                    // 1. Čtverečkovaná vintage parketová podlaha (střídavé tóny dřeva)
                    const tones = ['#8D5B2F', '#9C6636'];
                    for (let x = 0; x < W; x += tileSize) {
                        for (let y = PLAY_TOP; y < PLAY_BOTTOM; y += tileSize) {
                            const isCheck = (Math.floor(x / tileSize) + Math.floor((y - PLAY_TOP) / tileSize)) % 2 === 0;
                            ctx.fillStyle = isCheck ? tones[0] : tones[1];
                            ctx.fillRect(x, y, tileSize, tileSize);
                            // Čtverečkované pixelové spáry
                            ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
                            ctx.fillRect(x, y + tileSize - 1, tileSize, 1);
                            ctx.fillRect(x + tileSize - 1, y, 1, tileSize);
                            // Drobné pixelové letokruhy
                            if (isCheck) {
                                ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
                                ctx.fillRect(x + 4, y + 8, tileSize - 8, 2);
                            }
                        }
                    }

                    // 2. Retro pixelový sokl a horní zeď
                    pBox(ctx, 0, PLAY_TOP, W, 18, '#5D3A1A', '#3E2410', '#7A4D22', '#2B1607');
                    ctx.fillStyle = '#D4AF37';
                    for (let x = 8; x < W; x += 32) pRect(ctx, x, PLAY_TOP + 6, 4, 4);

                    // 3. Retro stojací lampa v rohu
                    pBox(ctx, 40, PLAY_TOP + 12, 14, 18, '#FFF9C4', '#FBC02D', '#FFFDE7', '#F57F17');
                    pRect(ctx, 46, PLAY_TOP + 30, 2, 45, '#D4AF37');
                    pRect(ctx, 38, PLAY_TOP + 75, 18, 4, '#B7950B');
                    // Stupňovitý pixelový kužel světla
                    ctx.fillStyle = 'rgba(255, 235, 160, 0.15)';
                    pRect(ctx, 20, PLAY_TOP + 30, 54, 40);
                    pRect(ctx, 10, PLAY_TOP + 70, 74, 50);

                    // 4. Retro pixelová monstera v květináči
                    pBox(ctx, 95, PLAY_TOP + 28, 20, 16, '#A0522D', '#5D4037', '#D7CCC8', '#3E2723');
                    // 8-bit listy rostliny
                    ctx.fillStyle = '#2E7D32';
                    pRect(ctx, 90, PLAY_TOP + 12, 12, 12);
                    pRect(ctx, 108, PLAY_TOP + 10, 14, 14);
                    pRect(ctx, 100, PLAY_TOP + 4, 12, 12);
                    ctx.fillStyle = '#1B5E20';
                    pRect(ctx, 94, PLAY_TOP + 16, 4, 4);
                    pRect(ctx, 112, PLAY_TOP + 14, 4, 4);

                    // 5. Retro stolek s 8-bit šálkem čaje
                    pBox(ctx, W - 85, PLAY_TOP + 24, 28, 20, '#4E342E', '#2B1A13', '#6D4C41', '#1B100B');
                    pBox(ctx, W - 76, PLAY_TOP + 14, 10, 8, '#FFFFFF', '#90A4AE', '#FFF', '#78909C');
                    pRect(ctx, W - 66, PLAY_TOP + 16, 3, 4, '#FFFFFF'); // Ucho šálku
                    // 8-bit stoupající pára
                    const sTick = Math.floor(this.animTime * 6) % 3;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    pRect(ctx, W - 73 + sTick, PLAY_TOP + 8 - sTick * 2, 2, 2);
                    pRect(ctx, W - 71 - sTick, PLAY_TOP + 4 - sTick * 2, 2, 2);

                } else if (this.config.theme === 'kitchen') {
                    // Čtverečkovaná retro šachovnice (50s Diner tyrkys & smetana)
                    for (let x = 0; x < W; x += tileSize) {
                        for (let y = PLAY_TOP; y < PLAY_BOTTOM; y += tileSize) {
                            const isOdd = (Math.floor(x / tileSize) + Math.floor((y - PLAY_TOP) / tileSize)) % 2 === 0;
                            ctx.fillStyle = isOdd ? '#E0F7FA' : '#00ACC1';
                            ctx.fillRect(x, y, tileSize, tileSize);
                            // Ostré černé spáry dlaždic
                            ctx.fillStyle = 'rgba(0, 50, 70, 0.3)';
                            ctx.fillRect(x, y + tileSize - 1, tileSize, 1);
                            ctx.fillRect(x + tileSize - 1, y, 1, tileSize);
                            // Bílý pixelový odlesk na dlaždici
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                            ctx.fillRect(x + 2, y + 2, 4, 2);
                        }
                    }

                    // Retro nerezová linka nahoře
                    pBox(ctx, 0, PLAY_TOP, W, 22, '#455A64', '#263238', '#90A4AE', '#1E272C');
                    // Toustovač s pixelovým toustem
                    pBox(ctx, 45, PLAY_TOP + 4, 22, 14, '#B0BEC5', '#37474F', '#ECEFF1', '#263238');
                    pRect(ctx, 50, PLAY_TOP + 1, 5, 4, '#FFB300'); // Toust
                    pRect(ctx, 58, PLAY_TOP + 1, 5, 4, '#FFB300');

                    // Kávovar
                    pBox(ctx, 85, PLAY_TOP + 3, 16, 16, '#ECEFF1', '#37474F', '#FFF', '#263238');
                    pRect(ctx, 88, PLAY_TOP + 9, 10, 8, '#3E2723'); // Káva uvnitř

                } else if (this.config.theme === 'garden') {
                    // Čtverečkovaný 16-bit RPG trávník (světle a tmavě zelené čtverečky)
                    for (let x = 0; x < W; x += tileSize) {
                        for (let y = PLAY_TOP; y < PLAY_BOTTOM; y += tileSize) {
                            const isCheck = (Math.floor(x / tileSize) + Math.floor((y - PLAY_TOP) / tileSize)) % 2 === 0;
                            ctx.fillStyle = isCheck ? '#43A047' : '#388E3C';
                            ctx.fillRect(x, y, tileSize, tileSize);
                            // Čtverečkovaná pixelová mřížka
                            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                            ctx.fillRect(x, y + tileSize - 1, tileSize, 1);
                            ctx.fillRect(x + tileSize - 1, y, 1, tileSize);
                        }
                    }

                    // 8-bit sedmikrásky na čtverečkách
                    for (let i = 0; i < 40; i++) {
                        const fx = ((i * 73) % (W - 60)) + 30;
                        const fy = PLAY_TOP + ((i * 59) % (PLAY_BOTTOM - PLAY_TOP - 40)) + 20;
                        ctx.fillStyle = '#FFFFFF';
                        pRect(ctx, fx - 2, fy, 2, 2);
                        pRect(ctx, fx + 2, fy, 2, 2);
                        pRect(ctx, fx, fy - 2, 2, 2);
                        pRect(ctx, fx, fy + 2, 2, 2);
                        pRect(ctx, fx, fy, 2, 2, '#FDD835'); // Žlutý střed
                    }

                    // Dřevěný laťkový plot nahoře
                    pBox(ctx, 0, PLAY_TOP, W, 12, '#5D4037', '#27170F', '#8D6E63', '#1B0E09');
                    for (let x = 8; x < W; x += 24) {
                        pBox(ctx, x, PLAY_TOP - 6, 10, 20, '#8D6E63', '#3E2723', '#A1887F', '#27170F');
                    }
                }

                // 6. Jemná vintage pixelová mřížka přes herní pole (akcent "čtverečkovaných her")
                ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
                for (let x = 0; x < W; x += tileSize) {
                    for (let y = PLAY_TOP; y < PLAY_BOTTOM; y += tileSize) {
                        ctx.fillRect(x, y, 1, 1);
                    }
                }

                ctx.restore();
            }

            // Dekorativní nábytek a doplňky mapy (přirozené zaplnění prostoru, nezasahují do mechanik)
            _renderDecorations(ctx) {
                ctx.save();
                if (this.config.theme === 'living') {
                    // 1. Pohovka (Sofa) - levý horní roh u stěny
                    pBox(ctx, 28, PLAY_TOP + 10, 115, 46, '#1E3A5F', '#4A739C', '#6497C9', '#0D1B2A');
                    pBox(ctx, 34, PLAY_TOP + 14, 48, 22, '#2C4C70', '#5B86B5', '#7CA5D4', '#15283C');
                    pBox(ctx, 86, PLAY_TOP + 14, 48, 22, '#2C4C70', '#5B86B5', '#7CA5D4', '#15283C');
                    pBox(ctx, 32, PLAY_TOP + 28, 16, 16, '#FBC02D', '#FFF59D', '#FFEE58', '#F57F17');
                    pBox(ctx, 120, PLAY_TOP + 28, 16, 16, '#FBC02D', '#FFF59D', '#FFEE58', '#F57F17');
                    pRect(ctx, 32, PLAY_TOP + 56, 6, 6, '#5D4037');
                    pRect(ctx, 132, PLAY_TOP + 56, 6, 6, '#5D4037');

                    // 2. Konferenční stolek (Coffee table) s horkou kávou a časopisem
                    pBox(ctx, 155, PLAY_TOP + 16, 68, 34, '#8D5B2F', '#A06E3E', '#C48A54', '#5D3A1A');
                    pBox(ctx, 172, PLAY_TOP + 24, 12, 10, '#FFFFFF', '#CFD8DC', '#ECEFF1', '#90A4AE');
                    pRect(ctx, 175, PLAY_TOP + 26, 6, 5, '#5D4037');
                    pBox(ctx, 192, PLAY_TOP + 22, 22, 14, '#ECEFF1', '#B0BEC5', '#FFFFFF', '#78909C');
                    pRect(ctx, 196, PLAY_TOP + 25, 14, 3, '#D32F2F');

                    // 3. Polička s knihami (Bookshelf) na zdi
                    pBox(ctx, 360, PLAY_TOP + 6, 125, 24, '#5D4037', '#795548', '#8D6E63', '#3E2723');
                    const bookCols = ['#D32F2F', '#1976D2', '#388E3C', '#FBC02D', '#7B1FA2', '#E64A19', '#0097A7', '#D32F2F', '#1976D2', '#388E3C', '#E91E63'];
                    for (let b = 0; b < bookCols.length; b++) {
                        pRect(ctx, 368 + b * 10, PLAY_TOP + 10, 8, 16, bookCols[b]);
                        pRect(ctx, 368 + b * 10 + 2, PLAY_TOP + 12, 4, 2, '#FFFFFF');
                    }
                    pRect(ctx, 474, PLAY_TOP + 10, 6, 6, '#FFD700'); // Zlatá trofej

                        ctx.strokeStyle = '#546E7A'; // Spáry

                        ctx.lineWidth = 34;
                        ctx.stroke();

                        // Mechové ostrůvky v chodníku

            _renderBuildSlots(ctx) {

            }

            _renderPlacementPreview(ctx) {
                if (this.selectedShopCat === null) return;
                const mx = this.mouseX, my = this.mouseY;

                // Pouze v herní ploše
                if (my < PLAY_TOP || my > PLAY_BOTTOM || mx < 0 || mx > W) return;

                const type = TOWER_TYPES[this.selectedShopCat];
                const range = type.levels[0].range;
                const isValid = this._isValidPlacement(mx, my);

                ctx.save();

                // Kruh dosahu
                if (isValid) {
                    ctx.fillStyle = 'rgba(76, 175, 80, 0.14)';
                    ctx.strokeStyle = '#4CAF50';
                } else {
                    ctx.fillStyle = 'rgba(244, 67, 54, 0.14)';
                    ctx.strokeStyle = '#F44336';
                }
                ctx.beginPath(); ctx.arc(mx, my, range, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 2.2;
                ctx.setLineDash([8, 6]);
                ctx.lineDashOffset = -this.animTime * 20;
                ctx.stroke();
                ctx.setLineDash([]);

                // Poloprůhledná kočka — zelená nebo červená podle platnosti
                ctx.globalAlpha = isValid ? 0.72 : 0.50;
                if (!isValid) {
                    // Červený nádech pro neplatnou pozici
                    ctx.save();
                    ctx.globalCompositeOperation = 'source-over';
                    // Červený kruh pod kočkou
                    ctx.fillStyle = 'rgba(244, 67, 54, 0.35)';
                    ctx.beginPath(); ctx.arc(mx, my, 28, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }
                Sprites.drawCatTower(ctx, mx, my, this.selectedShopCat, 0, { animTime: this.animTime });

                // Ikona X nebo ✓ (retro pixelový indikátor)
                ctx.globalAlpha = 1.0;
                pBox(ctx, mx - 22, my - 44, 44, 18, isValid ? '#1B5E20' : '#B71C1C', '#000000', isValid ? '#81C784' : '#E57373', '#000000');
                ctx.font = '8px "Press Start 2P", monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = isValid ? '#69F0AE' : '#FF8A80';
                ctx.fillText(isValid ? 'OK' : 'BLOK', mx, my - 34);

                ctx.restore();
            }

            _getNextUpgradeInfo(t) {
                if (t.level >= 2) return 'MAX';
                const next = t.type.levels[t.level + 1];
                const curr = t.stats;
                if (t.typeId === 7) {
                    return `+${Math.round((next.buff - curr.buff) * 100)}% buff, +${next.range - curr.range}px dosah`;
                }
                if (t.typeId === 8) {
                    return next.aoe ? `+${next.dmg - curr.dmg} Dmg, Plošný zásah 55px!` : `+${next.dmg - curr.dmg} Dmg, +${next.range - curr.range}px dosah, rychlejší`;
                }
                if (t.typeId === 9) {
                    return `+${next.maxHits - curr.maxHits} cílů, ${next.stunDur}s zastavení, rychlejší`;
                }
                return `+${next.dmg - curr.dmg} Dmg, +${next.range - curr.range}px Dosah`;
            }

            _renderTowerMenu(ctx) {
                const t = this.selectedTower;
                ctx.save();

                // Dosah vybrané věže
                ctx.fillStyle = 'rgba(33, 150, 243, 0.14)';
                ctx.beginPath(); ctx.arc(t.x, t.y, t.currentRange, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#2196F3'; ctx.lineWidth = 2;
                ctx.setLineDash([6, 5]);
                ctx.lineDashOffset = -this.animTime * 15;
                ctx.stroke();
                ctx.setLineDash([]);

                // Kontextové okénko (16-bit retro rámeček)
                let menuX = t.x + 35, menuY = t.y - 80;
                if (menuX + 225 > W) menuX = t.x - 235;
                if (menuY < PLAY_TOP + 10) menuY = PLAY_TOP + 10;
                if (menuY + 160 > PLAY_BOTTOM) menuY = PLAY_BOTTOM - 160;

                pBox(ctx, menuX, menuY, 225, 160, '#100C1E', '#4A3B69', '#6B5498', '#07050E');

                ctx.font = '9px "Press Start 2P", monospace'; ctx.fillStyle = '#FFE082'; ctx.textAlign = 'left';
                ctx.fillText(`${t.type.name}`, menuX + 12, menuY + 22);
                ctx.fillStyle = '#80D8FF';
                ctx.fillText(`LVL ${t.level + 1}`, menuX + 165, menuY + 22);

                ctx.font = '14px "VT323", monospace'; ctx.fillStyle = '#B0BEC5';
                let statsText = `DMG: ${Math.round(t.currentDmg)} | DOSAH: ${t.currentRange}px`;
                if (t.typeId === 7) {
                    statsText = `AURA: +${Math.round(t.stats.buff * 100)}% DMG | ${t.currentRange}px`;
                } else if (t.typeId === 8) {
                    statsText = `DMG: ${Math.round(t.currentDmg)}${t.stats.aoe ? ' [AOE]' : ''} | ${(1/t.currentRate).toFixed(1)}s/útok`;
                } else if (t.typeId === 9) {
                    statsText = `STOP: ${t.stats.maxHits} (${t.stats.stunDur}s) | ${(1/t.currentRate).toFixed(1)}s`;
                }
                ctx.fillText(statsText, menuX + 12, menuY + 44);

                if (t.level < 2) {
                    ctx.fillStyle = '#00E5FF';
                    ctx.fillText(`UPG: ${this._getNextUpgradeInfo(t)}`, menuX + 12, menuY + 64);
                } else {
                    ctx.fillStyle = '#FFD700';
                    ctx.fillText(`KILLS: ${t.kills} [MAX ÚROVEŇ]`, menuX + 12, menuY + 64);
                }

                // Vylepšit (retro pixel tlačítko)
                const upgCost = t.nextUpgradeCost;
                const canUpg = upgCost !== null && this.yarn >= upgCost;
                if (upgCost !== null) {

                    ctx.font = '8px "Press Start 2P", monospace';
                    ctx.fillStyle = canUpg ? '#FFFFFF' : '#78909C';
                    ctx.textAlign = 'center';
                    ctx.fillText(`▲ VYLEPŠIT ${upgCost}🧶 [U]`, menuX + 112, menuY + 98);
                } else {
                    pBox(ctx, menuX + 8, menuY + 80, 209, 32, '#212121', '#424242', '#616161', '#000');
                    ctx.font = '8px "Press Start 2P", monospace';
                    ctx.fillStyle = '#FFD700';
                    ctx.textAlign = 'center';
                    ctx.fillText('MAX ÚROVEŇ ★', menuX + 112, menuY + 98);
                }

                // Prodat (retro pixel tlačítko)
                pBox(ctx, menuX + 8, menuY + 118, 209, 30, '#B71C1C', '#D32F2F', '#E57373', '#5F0909');
                ctx.font = '8px "Press Start 2P", monospace';
                ctx.fillStyle = '#FFFFFF';
                ctx.textAlign = 'center';
                ctx.fillText(`✖ PRODAT +${t.sellValue}🧶 [S]`, menuX + 112, menuY + 135);

                ctx.restore();
            }

                const canStartWave = !this.waveInProgress && this.currentWave < this.totalWaves && !this.paused;

                let waveBtnBg = canStartWave ? (waveBlink ? '#FF6F00' : '#E65100') : '#37474F';

            getShopTowers() {
                return [...TOWER_TYPES].sort((a, b) => a.cost - b.cost);
            }

            // Spodní nákupní lišta s 10 retro kartami koček (seřazeno podle ceny)
            _renderShopPanel(ctx) {
                ctx.save();
                pBox(ctx, 0, PLAY_BOTTOM, W, H - PLAY_BOTTOM, '#121024', '#392E5C', '#58478C', '#0A0814');

                const cardW = 86, cardH = 92, startX = 14, startY = PLAY_BOTTOM + 7, gap = 8;
                const shopCats = this.getShopTowers();

                for (let i = 0; i < shopCats.length; i++) {
                    const cat = shopCats[i];
                    const cx = startX + i * (cardW + gap);
                    const cy = startY;
                    const isSelected = this.selectedShopCat === cat.id;
                    const isHovered = this.hoveredShopCat === cat.id;
                    const canAfford = this.yarn >= cat.cost;

                    // 16-bit retro slot karty
                    let bg = '#1E1B32';
                    let border = '#3D3463';
                    let hi = '#584C8C', sh = '#100D1E';

                    if (isSelected) {
                        bg = '#311B92'; border = '#FFD700'; hi = '#FFF59D'; sh = '#FF8F00';
                    } else if (isHovered) {
                        bg = '#2A2447'; border = '#00E5FF'; hi = '#80D8FF'; sh = '#0091EA';
                    } else if (!canAfford) {
                        bg = '#141220'; border = '#262238'; hi = '#302A44'; sh = '#08070F';
                    }

                    pBox(ctx, cx, cy, cardW, cardH, bg, border, hi, sh);

                    // Klávesová zkratka [1-9, 0]
                    const hotkeyText = i === 9 ? '[0]' : `[${i + 1}]`;
                    ctx.font = '8px "Press Start 2P", monospace';
                    ctx.fillStyle = isSelected ? '#FFD700' : '#80D8FF';
                    ctx.textAlign = 'left';
                    ctx.fillText(hotkeyText, cx + 5, cy + 13);

                    // Pixelová ikona kočky
                    ctx.save();
                    Sprites.drawCatTower(ctx, cx + cardW / 2, cy + 34, cat.id, 0, { size: 14, animTime: this.animTime });
                    ctx.restore();

                    // Jméno kočky
                    ctx.font = '8px "Press Start 2P", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillStyle = isSelected ? '#FFD700' : (canAfford ? '#FFFFFF' : '#78909C');
                    ctx.fillText(cat.name, cx + cardW / 2, cy + 56);

                    // Role
                    ctx.font = '7px "Press Start 2P", monospace';
                    ctx.fillStyle = '#90A4AE';
                    ctx.fillText(cat.role.split(' ')[0], cx + cardW / 2, cy + 68);

                    // Cena
                    drawPixelYarn(ctx, cx + cardW / 2 - 14, cy + 81, 10, canAfford ? '#FFD700' : '#FF5252');
                    ctx.font = '8px "Press Start 2P", monospace';
                    ctx.fillStyle = canAfford ? '#FFD700' : '#FF5252';
                    ctx.fillText(`${cat.cost}`, cx + cardW / 2 + 8, cy + 82);
                }

                if (this.hoveredShopCat !== null) this._renderShopTooltip(ctx, this.hoveredShopCat);
                ctx.restore();
            }

            _renderShopTooltip(ctx, catId) {
                const cat = TOWER_TYPES.find(t => t.id === catId) || TOWER_TYPES[catId];
                if (!cat) return;
                const stats = cat.levels[0];
                const cardW = 86, startX = 14, gap = 8;
                const tipW = 380, tipH = 125;
                const shopCats = this.getShopTowers();
                const slotIdx = shopCats.findIndex(c => c.id === catId);
                const tipIdx = slotIdx >= 0 ? slotIdx : 0;
                let tipX = startX + tipIdx * (cardW + gap) + cardW / 2 - tipW / 2;
                if (tipX + tipW > W - 12) tipX = W - tipW - 12;
                if (tipX < 12) tipX = 12;
                const tipY = PLAY_BOTTOM - tipH - 10;

                ctx.save();
                // 16-bit RPG textové okno (navy pozadí s dvojitým rámečkem)
                pBox(ctx, tipX, tipY, tipW, tipH, '#0C1226', '#FFD700', '#FFFDE7', '#050811');

                ctx.font = '9px "Press Start 2P", monospace';
                ctx.fillStyle = '#FFD700'; ctx.textAlign = 'left';
                ctx.fillText(`★ ${cat.name.toUpperCase()} (${cat.role}) — ${cat.cost} YARN`, tipX + 12, tipY + 20);

                ctx.font = '8px "Press Start 2P", monospace';
                ctx.fillStyle = '#E0F7FA';
                let statsLine = `DMG:${stats.dmg} | SPD:${stats.rate}/s | RNG:${stats.range}px`;
                if (cat.id === 9) {
                    statsLine = `STOP:${stats.maxHits} (${stats.stunDur}s) | ${(1/stats.rate).toFixed(1)}s | SPD:${stats.speed}`;
                } else if (cat.id === 7) {
                    statsLine = `AURA:+${Math.round(stats.buff * 100)}% DMG | RNG:${stats.range}px`;
                }
                ctx.fillText(statsLine, tipX + 12, tipY + 42);

                ctx.fillStyle = '#FF80AB';
                ctx.fillText(`EFFECT: ${cat.specialDesc}`, tipX + 12, tipY + 64);

                ctx.fillStyle = '#B0BEC5';
                ctx.font = '11px Arial';
                ctx.fillText(cat.desc, tipX + 12, tipY + 86);

                ctx.fillStyle = '#80D8FF';
                ctx.font = '7px "Press Start 2P", monospace';
                ctx.fillText('► KLIKNI PRO VYBER, POTOM NA PLOCHU PRO STAVBU', tipX + 12, tipY + 110);
                ctx.restore();
            }

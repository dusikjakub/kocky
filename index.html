                    'Garfield skvěle zvládá celé skupiny menších vysavačů.',
                    'Mainská kočka spolehlivě zastaví těžké průmyslové tanky.',
                    'Kombinuj Sfinx s ostatními kočkami pro mocné poškození.',
                    'Perská kočka citelně zpomalí i nejrychlejší Roomby Turbo.',
                    'Proti EMP vysavači je Sfinx zcela imunní!',
                    'Prodej slabší kočky a vylepšuj ty na klíčových zatáčkách.'
                ];
                return tips[Math.floor(Math.random() * tips.length)];
            }

            // ─────────────────────────────────────────────
            //  OVLÁDÁNÍ
            // ─────────────────────────────────────────────
            handleClick(mx, my) {
                if (this.isVictory) {
                    const mh = 380, my0 = H / 2 - mh / 2;
                    const btn1X = W / 2 - 240, btn1Y = my0 + mh - 60;
                    const btn2X = W / 2 + 20, btn2Y = my0 + mh - 60;
                    if (pointInRect(mx, my, btn1X, btn1Y, 220, 44)) { this.game.audio.play('click'); this.game.startGame(this.mapId); }
                    else if (pointInRect(mx, my, btn2X, btn2Y, 220, 44)) { this.game.audio.play('click'); this.game.setState('mapSelect'); }
                    return;
                }

                if (this.isGameOver) {
                    const mh = 360, my0 = H / 2 - mh / 2;
                    const btn1X = W / 2 - 240, btn1Y = my0 + mh - 60;
                    const btn2X = W / 2 + 20, btn2Y = my0 + mh - 60;
                    if (pointInRect(mx, my, btn1X, btn1Y, 220, 44)) { this.game.audio.play('click'); this.game.startGame(this.mapId); }
                    else if (pointInRect(mx, my, btn2X, btn2Y, 220, 44)) { this.game.audio.play('click'); this.game.setState('mapSelect'); }
                    return;
                }

                // HUD (horní lišta)
                if (my <= PLAY_TOP) {
                    if (pointInRect(mx, my, 8, 8, 72, 34)) {
                        this.game.audio.play('click');
                        this.game.setState('mapSelect');
                        return;
                    }
                    if (pointInRect(mx, my, 530, 8, 48, 34)) {
                        this.gameSpeed = this.gameSpeed === 1.0 ? 2.0 : 1.0;
                        this.game.audio.play('click');
                        this.floatingTexts.push(new FloatingText(554, PLAY_TOP + 18, `${this.gameSpeed}X RYCHLOST`, '#FFA000', 13, true));
                        return;
                    }
                    if (pointInRect(mx, my, 584, 8, 36, 34)) {
                        this.paused = !this.paused;
                        this.game.audio.play('pause');
                        return;
                    }
                    if (pointInRect(mx, my, 626, 8, 36, 34)) {
                        const isSound = this.game.audio.toggleSound();
                        this.floatingTexts.push(new FloatingText(644, PLAY_TOP + 18, isSound ? 'ZVUK ZAPNUT 🔊' : 'ZVUK ZTLUMEN 🔇', isSound ? '#00E676' : '#FF5252', 12, true));
                        return;
                    }
                    if (pointInRect(mx, my, 666, 8, 36, 34)) {
                        this.game.toggleFullscreen();
                        return;
                    }
                    if (pointInRect(mx, my, 706, 8, 246, 34)) {
                        if (!this.waveInProgress && !this.paused) this.startNextWave();
                        return;
                    }
                    return;
                }

                // Kliknutí na pause overlay pro pokračování ve hře
                if (this.paused && !this.isVictory && !this.isGameOver) {
                    if (pointInRect(mx, my, W / 2 - 200, H / 2 - 60, 400, 100)) {
                        this.paused = false;
                        this.game.audio.play('pause');
                        return;
                    }
                }

                // Spodní lišta obchodu (seřazená podle ceny)
                if (my >= PLAY_BOTTOM) {
                    const cardW = 86, startX = 14, gap = 8;
                    const shopCats = this.getShopTowers();
                    for (let i = 0; i < shopCats.length; i++) {
                        const cat = shopCats[i];
                        const cx = startX + i * (cardW + gap);
                        if (pointInRect(mx, my, cx, PLAY_BOTTOM + 7, cardW, 92)) {
                            this.selectedShopCat = this.selectedShopCat === cat.id ? null : cat.id;
                            this.selectedTower = null;
                            this.game.audio.play('click');
                            return;
                        }
                    }
                    return;
                }

                // ── HERNÍ PLOCHA ──

                // Kontextové menu věže (upgrade/prodej)
                if (this.selectedTower) {
                    const t = this.selectedTower;
                    let menuX = t.x + 35, menuY = t.y - 80;
                    if (menuX + 225 > W) menuX = t.x - 235;
                    if (menuY < PLAY_TOP + 10) menuY = PLAY_TOP + 10;
                    if (menuY + 160 > PLAY_BOTTOM) menuY = PLAY_BOTTOM - 160;

                    if (pointInRect(mx, my, menuX + 8, menuY + 80, 209, 32)) {
                        const cost = t.nextUpgradeCost;
                        if (cost !== null && this.yarn >= cost) {
                            this.yarn -= cost;
                            t.upgrade();
                            this.game.audio.play('upgrade');
                            this.floatingTexts.push(new FloatingText(t.x, t.y - 25, `LVL UP! ★`, '#00E676', 15, true));
                        } else { this.game.audio.play('error'); }
                        return;
                    }
                    if (pointInRect(mx, my, menuX + 8, menuY + 118, 209, 30)) {
                        const refund = t.sellValue;
                        this.yarn += refund;
                        this.game.audio.play('sell');
                        // Odstranění věže (bez závislosti na slotech)
                        this.towers = this.towers.filter(tw => tw !== t);
                        this.floatingTexts.push(new FloatingText(t.x, t.y - 20, `+${refund} 🧶`, '#FFD700', 14));
                        this.selectedTower = null;
                        return;
                    }
                }

                // Pokud je vybraná kategorie z obchodu — pokus o stavbu věže
                if (this.selectedShopCat !== null) {
                    const type = TOWER_TYPES[this.selectedShopCat];

                    if (!this._isValidPlacement(mx, my)) {
                        this.game.audio.play('error');
                        // Vizuální feedback — záblesk
                        this.floatingTexts.push(new FloatingText(mx, my - 20,
                            this._isOnPath(mx, my) ? '🚫 Cesta!' :
                            this._overlapsExistingTower(mx, my) ? '🚫 Obsazeno!' : '🚫 Mimo plochu!',
                            '#F44336', 13));
                        return;
                    }

                    if (this.yarn < type.cost) {
                        this.game.audio.play('error');
                        this.floatingTexts.push(new FloatingText(mx, my - 20, `Nedostatek 🧶!`, '#FF5252', 13));
                        return;
                    }

                    // Postavení věže na libovolnou platnou pozici
                    this.yarn -= type.cost;
                    const tower = new Tower(-1, this.selectedShopCat, mx, my);
                    this.towers.push(tower);
                    this.game.audio.play('build');
                    this.particles.emitExplosion(mx, my, '#FFD700', 10);
                    this.floatingTexts.push(new FloatingText(mx, my - 25, `${type.name} 🐱`, '#FFD700', 13));
                    return;
                }

                // Kliknutí na existující věž (výběr)
                const clickedTower = this.towers.find(t => dist(mx, my, t.x, t.y) <= 24);
                if (clickedTower) {
                    this.selectedTower = clickedTower;
                    this.selectedShopCat = null;
                    this.game.audio.play('click');
                    return;
                }

                // Kliknutí do prázdna — zrušit výběry
                this.selectedTower = null;
            }

            _findSlotAt(mx, my) {
                return this.slots.find(s => dist(mx, my, s.x, s.y) <= 26) || null;
            }

            handleMouseMove(mx, my) {
                this.mouseX = mx;
                this.mouseY = my;
                this.hoveredSlot = null; // Sloty se již nepoužívají pro umisťování
                this.hoveredShopCat = null;
                this.hoveredHudBtn = null;

                if (my <= PLAY_TOP) {
                    if (pointInRect(mx, my, 8, 8, 72, 34)) this.hoveredHudBtn = 'back';
                    else if (pointInRect(mx, my, 530, 8, 48, 34)) this.hoveredHudBtn = 'speed';
                    else if (pointInRect(mx, my, 584, 8, 36, 34)) this.hoveredHudBtn = 'pause';
                    else if (pointInRect(mx, my, 626, 8, 36, 34)) this.hoveredHudBtn = 'sound';
                    else if (pointInRect(mx, my, 666, 8, 36, 34)) this.hoveredHudBtn = 'fullscreen';
                    else if (pointInRect(mx, my, 706, 8, 246, 34)) this.hoveredHudBtn = 'wave';
                } else if (my >= PLAY_BOTTOM) {
                    const cardW = 86, startX = 14, gap = 8;
                    const shopCats = this.getShopTowers();
                    for (let i = 0; i < shopCats.length; i++) {
                        const cat = shopCats[i];
                        const cx = startX + i * (cardW + gap);
                        if (pointInRect(mx, my, cx, PLAY_BOTTOM + 7, cardW, 92)) {
                            this.hoveredShopCat = cat.id;
                            break;
                        }
                    }
                }

                if (this.hoveredHudBtn || this.hoveredShopCat !== null) {
                    this.game.canvas.style.cursor = 'pointer';
                } else {
                    this.game.canvas.style.cursor = 'default';
                }
            }

            handleKeyDown(code) {
                const shopCats = this.getShopTowers();
                if (code >= 'Digit1' && code <= 'Digit9') {
                    const idx = parseInt(code.replace('Digit', '')) - 1;
                    if (idx >= 0 && idx < shopCats.length) {
                        const catId = shopCats[idx].id;
                        this.selectedShopCat = this.selectedShopCat === catId ? null : catId;
                        this.selectedTower = null;
                        this.game.audio.play('click');
                    }
                } else if (code === 'Digit0') {
                    const idx = 9;
                    if (idx < shopCats.length) {
                        const catId = shopCats[idx].id;
                        this.selectedShopCat = this.selectedShopCat === catId ? null : catId;
                        this.selectedTower = null;
                        this.game.audio.play('click');
                    }
                } else if (code === 'Space') {
                    if (this.paused) { this.paused = false; this.game.audio.play('pause'); }
                    else if (!this.waveInProgress && !this.isVictory && !this.isGameOver) this.startNextWave();
                } else if (code === 'KeyP') {
                    if (!this.isVictory && !this.isGameOver) { this.paused = !this.paused; this.game.audio.play('pause'); }
                } else if (code === 'KeyX' || code === 'KeyF') {
                    this.gameSpeed = this.gameSpeed === 1.0 ? 2.0 : 1.0;
                    this.game.audio.play('click');
                    this.floatingTexts.push(new FloatingText(554, PLAY_TOP + 18, `${this.gameSpeed}X RYCHLOST`, '#FFA000', 13, true));
                } else if (code === 'KeyZ' || code === 'KeyN') {
                    const isSound = this.game.audio.toggleSound();
                    this.floatingTexts.push(new FloatingText(644, PLAY_TOP + 18, isSound ? 'ZVUK ZAPNUT 🔊' : 'ZVUK ZTLUMEN 🔇', isSound ? '#00E676' : '#FF5252', 12, true));
                } else if (code === 'Escape') {
                    if (this.paused) { this.paused = false; }
                    else { this.selectedShopCat = null; this.selectedTower = null; }
                } else if (code === 'KeyU' && this.selectedTower) {
                    const cost = this.selectedTower.nextUpgradeCost;
                    if (cost !== null && this.yarn >= cost) {
                        this.yarn -= cost; this.selectedTower.upgrade();
                        this.game.audio.play('upgrade');
                        this.floatingTexts.push(new FloatingText(this.selectedTower.x, this.selectedTower.y - 25, `LVL UP! ★`, '#00E676', 15, true));
                    } else { this.game.audio.play('error'); }
                } else if (code === 'KeyS' && this.selectedTower) {
                    const refund = this.selectedTower.sellValue;
                    this.yarn += refund;
                    this.game.audio.play('sell');
                    // Bez závislosti na slotu — věže jsou volně umístěné
                    this.towers = this.towers.filter(tw => tw !== this.selectedTower);
                    this.floatingTexts.push(new FloatingText(this.selectedTower.x, this.selectedTower.y - 20, `+${refund} 🧶`, '#FFD700', 14));
                    this.selectedTower = null;
                } else if (code === 'KeyR' && (this.isVictory || this.isGameOver)) {
                    this.game.audio.play('click');
                    this.game.startGame(this.mapId);
                } else if (code === 'KeyM' && (this.isVictory || this.isGameOver)) {
                    this.game.audio.play('click');
                    this.game.setState('mapSelect');
                }
            }
        }

        // ─────────────────────────────────────────────
        //  VACUUM EAT ANIMATION (Speciální animace tlačítka HRÁT)
        // ─────────────────────────────────────────────
        class VacuumEatAnimation {
            constructor(buttonX, buttonY, buttonW, buttonH, onComplete) {
                this.btnX = buttonX; this.btnY = buttonY; this.btnW = buttonW; this.btnH = buttonH;
                this.onComplete = onComplete;
                this.time = 0; this.phase = 'approach';
                this.vacuum = { x: -80, y: buttonY, angle: 0 };
                this.targetX = buttonX;
                this.particles = new ParticleSystem();
                this.buttonOpacity = 1; this.buttonScale = 1;
                this.vacuumScale = 1; this.suctionAngle = 0; this.fadeAlpha = 0;
                this.shakeX = 0; this.shakeY = 0; this.suctionBeamAlpha = 0;
                this.finished = false;
                this.approachDuration = 1.3; this.consumeDuration = 1.8;
                this.departDuration = 0.8; this.fadeDuration = 0.6;
            }

            update(dt) {
                this.time += dt; this.suctionAngle += dt * 5;
                switch (this.phase) {
                    case 'approach': {
                        const t = Math.min(1, this.time / this.approachDuration);
                        const eased = easeOutCubic(t);
                        this.vacuum.x = lerp(-80, this.targetX - 65, eased);
                        this.vacuum.y = this.btnY + Math.sin(this.time * 8) * 2;
                        if (t >= 1) { this.phase = 'consume'; this.time = 0; }
                        break;
                    }
                    case 'consume': {
                        const t = Math.min(1, this.time / this.consumeDuration);
                        this.buttonOpacity = Math.max(0, 1 - t * 1.3);
                        this.buttonScale = Math.max(0.1, 1 - t * 0.85);
                        this.suctionBeamAlpha = Math.sin(t * Math.PI) * 0.65;
                        this.vacuum.x = lerp(this.targetX - 65, this.targetX - 20, t * 0.5);
                        this.vacuum.y = this.btnY + Math.sin(this.time * 10) * 1.5;
                        this.vacuumScale = 1 + t * 0.15;
                        this.shakeX = (Math.random() - 0.5) * t * 3.5;
                        this.shakeY = (Math.random() - 0.5) * t * 3.5;

                        if (Math.random() < 0.65 + t * 0.35) {
                            const px = this.btnX + (Math.random() - 0.5) * this.btnW * (1 - t);
                            const py = this.btnY + (Math.random() - 0.5) * this.btnH * (1 - t);
                            this.particles.emit(px, py, 1, {
                                attractTo: this.vacuum,
                                attractForce: 420 + t * 300,
                                color: ['#FF6F00', '#FFA000', '#FFD700', '#FFF'][Math.floor(Math.random() * 4)],
                                size: 2.5 + Math.random() * 3.5,
                                life: 0.8, decay: 1
                            });
                        }
                        if (t >= 1) { this.phase = 'depart'; this.time = 0; this.shakeX = 0; this.shakeY = 0; this.buttonOpacity = 0; }
                        break;
                    }
                    case 'depart': {
                        const t = Math.min(1, this.time / this.departDuration);
                        this.vacuum.x = lerp(this.targetX - 20, W + 100, easeInOutCubic(t));
                        this.vacuum.y = this.btnY + Math.sin(this.time * 6) * 2;
                        this.suctionBeamAlpha = 0;
                        if (t >= 0.3) this.fadeAlpha = (t - 0.3) / 0.7;
                        if (t >= 1) { this.phase = 'fade'; this.time = 0; }
                        break;
                    }
                    case 'fade': {
                        const t = Math.min(1, this.time / this.fadeDuration);
                        this.fadeAlpha = 1;
                        if (t >= 1 && !this.finished) { this.finished = true; this.onComplete(); }
                        break;
                    }
                }
                this.particles.update(dt);
            }

            render(ctx) {
                ctx.save();
                ctx.translate(this.shakeX, this.shakeY);

                if (this.suctionBeamAlpha > 0) {
                    ctx.save(); ctx.globalAlpha = this.suctionBeamAlpha;
                    const grad = ctx.createLinearGradient(this.vacuum.x, this.vacuum.y, this.btnX, this.btnY);
                    grad.addColorStop(0, 'rgba(0, 229, 255, 0.55)');
                    grad.addColorStop(1, 'rgba(255, 140, 0, 0.35)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(this.vacuum.x + 20, this.vacuum.y - 12);
                    ctx.lineTo(this.btnX - this.btnW / 2 * this.buttonScale, this.btnY - this.btnH / 2 * this.buttonScale);
                    ctx.lineTo(this.btnX + this.btnW / 2 * this.buttonScale, this.btnY + this.btnH / 2 * this.buttonScale);
                    ctx.lineTo(this.vacuum.x + 20, this.vacuum.y + 12);
                    ctx.closePath(); ctx.fill(); ctx.restore();
                }

                if (this.buttonOpacity > 0) {
                    ctx.save(); ctx.globalAlpha = this.buttonOpacity;
                    ctx.translate(this.btnX, this.btnY); ctx.scale(this.buttonScale, this.buttonScale);
                    pBox(ctx, -this.btnW / 2, -this.btnH / 2, this.btnW, this.btnH, '#FF6F00', '#FFD54F', '#FFF', '#8A2B00');
                    ctx.fillStyle = '#FFF'; ctx.font = '13px "Press Start 2P", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('►  HRÁT  ◄', 0, 0); ctx.restore();
                }

                this.particles.render(ctx);

                Sprites.drawEnemy(ctx, {
                    x: this.vacuum.x, y: this.vacuum.y, radius: 26 * this.vacuumScale,
                    typeKey: 'basic', angle: 0, animTime: this.time
                });

                ctx.restore();
                if (this.fadeAlpha > 0) {
                    ctx.fillStyle = `rgba(13, 13, 24, ${this.fadeAlpha})`;
                    ctx.fillRect(0, 0, W, H);
                }
            }
        }

        // ─────────────────────────────────────────────
        //  HLAVNÍ MENU (Vintage 8-bit arkádová úvodní obrazovka - Kočičí základna)
        // ─────────────────────────────────────────────
        class MainMenu {
            constructor(game) {
                this.game = game;
                this.time = 0;
                this.btnW = 280; this.btnH = 56;
                this.btnX = W / 2; this.btnY = 530;
                this.btnHovered = false;
                this.soundHovered = false;
                this.fsHovered = false;
                this.showButton = true;
                this.vacuumAnim = null;

                // Roaming robotický vysavač na podlaze základny
                this.roamVac = { x: 140, y: 585, dir: 1, speed: 75 };

                // Poletující 8-bit prachové čtverečky ve světle
                this.motes = [];
                for (let i = 0; i < 28; i++) {
                    this.motes.push({
                        x: 60 + Math.random() * (W - 120),
                        y: 100 + Math.random() * (H * 0.65),
                        vx: -6 + Math.random() * 12,
                        vy: -4 + Math.random() * 8,
                        size: (Math.random() > 0.5 ? 4 : 2),
                        phase: Math.random() * Math.PI * 2
                    });
                }

                // Stoupající 8-bit "Zzz" od spícího Garfielda
                this.zzzParticles = [];
                for (let i = 0; i < 4; i++) {
                    this.zzzParticles.push({
                        x: 585,
                        y: 340 - i * 14,
                        alpha: 1 - i * 0.25,
                        vy: -16
                    });
                }

                this.game.audio.setTrack('menu');
            }

            update(dt) {
                this.time += dt;
                this.game.audio.updateMusic();

                for (let m of this.motes) {
                    m.x += m.vx * dt;
                    m.y += m.vy * dt;
                    if (m.y < 80) m.y = H * 0.76;
                    if (m.y > H * 0.78) m.y = 85;
                    if (m.x < 30) m.x = W - 40;
                    if (m.x > W - 30) m.x = 40;
                }

                for (let z of this.zzzParticles) {
                    z.y += z.vy * dt;
                    z.alpha -= dt * 0.35;
                    if (z.alpha <= 0) {
                        z.x = 585 + (Math.random() - 0.5) * 8;
                        z.y = 340;
                        z.alpha = 0.95;
                    }
                }

                if (this.vacuumAnim) {
                    this.vacuumAnim.update(dt);
                } else {
                    this.roamVac.x += this.roamVac.dir * this.roamVac.speed * dt;
                    if (this.roamVac.x > W - 100 && this.roamVac.dir === 1) {
                        this.roamVac.dir = -1;
                        this.game.audio.play('hover');
                    } else if (this.roamVac.x < 100 && this.roamVac.dir === -1) {
                        this.roamVac.dir = 1;
                        this.game.audio.play('hover');
                    }
                }
            }

            render(ctx) {
                const wallH = 320;
                const tileSize = 32;

                // 1. Zdi s retro dřevěnou tapetou a lištou
                pBox(ctx, 0, 0, W, wallH, '#6D3F1E', '#4A2A14', '#8D5B2F', '#321B0A');
                ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
                for (let x = 0; x < W; x += tileSize) {
                    for (let y = 0; y < wallH; y += tileSize) {
                        if ((Math.floor(x / tileSize) + Math.floor(y / tileSize)) % 2 === 0) {
                            ctx.fillRect(x, y, tileSize, tileSize);
                        }
                    }
                }
                // Dřevěná římsa
                pBox(ctx, 0, wallH - 12, W, 12, '#3E2723', '#4E342E', '#5D4037', '#21130B');

                // 2. Taktická nástěnka kočičí základny: "PLÁN OBRANY: PROTI VYSAVAČŮM"
                pBox(ctx, W / 2 - 130, 114, 260, 68, '#4E342E', '#6D4C41', '#8D6E63', '#27170F'); // Dřevěný rám
                pBox(ctx, W / 2 - 124, 120, 248, 56, '#D7CCC8', '#EFEBE9', '#FFFFFF', '#BCAAA4'); // Korková tabule
                ctx.fillStyle = '#000000'; ctx.font = '7px "Press Start 2P", monospace'; ctx.textAlign = 'center';
                ctx.fillText('PLÁN OBRANY PROTI VYSAVAČŮM', W / 2, 132);
                // Mini náčrtek vysavače a červené špendlíky
                pBox(ctx, W / 2 - 95, 140, 24, 20, '#CFD8DC', '#ECEFF1', '#FFFFFF', '#90A4AE');
                ctx.font = '12px Arial'; ctx.fillText('🤖', W / 2 - 83, 151);
                pRect(ctx, W / 2 - 92, 137, 4, 4, '#D32F2F'); // Špendlík 1
                pRect(ctx, W / 2 + 88, 137, 4, 4, '#D32F2F'); // Špendlík 2
                // Červená taktická linie
                ctx.strokeStyle = '#D32F2F'; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(W / 2 - 70, 150); ctx.lineTo(W / 2 + 70, 150); ctx.stroke();
                pBox(ctx, W / 2 + 65, 140, 28, 20, '#FFF9C4', '#FFFDE7', '#FFFFFF', '#FBC02D');
                ctx.font = '12px Arial'; ctx.fillText('🧶', W / 2 + 79, 151);

                // 3. Obrazy & diplomy na stěnách základny
                pBox(ctx, 45, 116, 72, 58, '#FFF8E7', '#FFD700', '#FFF', '#B8860B');
                ctx.font = '22px Arial'; ctx.fillText('🐾', 81, 140);
                ctx.font = '6px "Press Start 2P", monospace'; ctx.fillStyle = '#5D4037';
                ctx.fillText('ELITA 1★', 81, 164);

                pBox(ctx, W - 118, 116, 72, 58, '#FFF8E7', '#FFD700', '#FFF', '#B8860B');
                ctx.font = '20px Arial'; ctx.fillText('🏆', W - 82, 140);

                if (this.showButton && !this.vacuumAnim) {
                    if (pointInRect(mx, my, this.btnX - this.btnW / 2, this.btnY - this.btnH / 2, this.btnW, this.btnH)) {

                    pointInRect(mx, my, this.btnX - this.btnW / 2, this.btnY - this.btnH / 2, this.btnW, this.btnH);

        // ─────────────────────────────────────────────
        //  VÝBĚR MAP (Retro Stage Select)
        // ─────────────────────────────────────────────
        class MapSelect {
            constructor(game) {
                this.game = game;
                this.hoveredCard = null;
                this.backHovered = false;
                this.time = 0;
                this.transition = null;
            }

            update(dt) {
                this.time += dt;
                this.game.audio.updateMusic();

                if (this.transition) {
                    this.transition.time += dt;
                    for (let p of this.transition.particles) {
                        p.x += p.vx * dt;
                        p.y += p.vy * dt;
                        p.alpha = Math.max(0, p.alpha - dt * 1.5);
                    }
                    if (this.transition.time >= this.transition.duration) {
                        const targetMap = this.transition.mapIndex;
                        this.transition = null;
                        this.game.startGame(targetMap);
                        return;
                    }
                }
            }

            startMapTransition(mapIndex, cx, cy, cardW, cardH) {
                this.game.audio.play('select');
                this.game.audio.play('whoosh');
                const particles = [];
                const midX = cx + cardW / 2;
                const midY = cy + cardH / 2;
                for (let k = 0; k < 30; k++) {
                    const ang = Math.random() * Math.PI * 2;
                    const spd = 70 + Math.random() * 220;
                    particles.push({
                        x: midX + (Math.random() - 0.5) * (cardW * 0.8),
                        y: midY + (Math.random() - 0.5) * (cardH * 0.8),
                        vx: Math.cos(ang) * spd,
                        vy: Math.sin(ang) * spd,
                        size: 4,
                        color: ['#FFD700', '#FFAB00', '#FFFFFF', '#00E5FF'][Math.floor(Math.random() * 4)],
                        alpha: 1
                    });
                }
                this.transition = {
                    mapIndex: mapIndex,
                    time: 0,
                    duration: 0.65,
                    cardRect: { x: cx, y: cy, w: cardW, h: cardH },
                    particles: particles
                };
            }

            render(ctx) {
                // Retro mřížkované pozadí
                ctx.fillStyle = '#0E0C18';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
                for (let x = 0; x < W; x += 32) {
                    for (let y = 0; y < H; y += 32) {
                        if ((Math.floor(x / 32) + Math.floor(y / 32)) % 2 === 0) ctx.fillRect(x, y, 32, 32);
                    }
                }

                // Tlačítko Zpět do menu (vlevo nahoře)
                pBox(ctx, 30, 26, 92, 36, this.backHovered ? '#3F3560' : '#262238', '#4A4269', '#63598C', '#151322');
                ctx.font = '8px "Press Start 2P", monospace';
                ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('◄ MENU', 76, 44);

                // Tlačítko Zvuk (vpravo nahoře)
                const sndBg = this.game.audio.enabled ? '#1B5E20' : '#37474F';
                pBox(ctx, W - 60, 26, 44, 36, sndBg, this.game.audio.enabled ? '#4CAF50' : '#78909C', '#81C784', '#0E3813');
                ctx.font = '16px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(this.game.audio.enabled ? '🔊' : '🔇', W - 38, 44);

                ctx.font = '22px "Press Start 2P", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
                ctx.fillStyle = '#FFD700'; ctx.fillText('★ SELECT STAGE ★', W / 2, 64);

                ctx.font = '8px "Press Start 2P", monospace'; ctx.fillStyle = '#90A4AE';
                ctx.fillText('ZVOL BOJISTE A BRAN BABICKU PRED ROBOTY!', W / 2, 88);

                const cardW = 244, cardH = 345, startX = 76, gap = 60, cy = 115;

                for (let i = 0; i < MAP_CONFIGS.length; i++) {
                    const m = MAP_CONFIGS[i];
                    const cx = startX + i * (cardW + gap);
                    const isHovered = this.hoveredCard === i && !this.transition;
                    const isLocked = !unlockedMaps[i];

                    // 16-bit retro monitor karty
                    let bg = isLocked ? '#14141E' : '#1A182E';
                    let border = isLocked ? '#333344' : (isHovered ? '#FFD700' : '#455A64');
                    let hi = isHovered && !isLocked ? '#FFF59D' : '#332E4C';
                    let sh = '#080811';

                    pBox(ctx, cx, cy, cardW, cardH, bg, border, hi, sh);

                    // Náhled mapy v rámečku monitoru
                    pBox(ctx, cx + 12, cy + 12, cardW - 24, 150, isLocked ? '#0A0A10' : m.bgColor, '#000', '#444', '#111');

                    if (isLocked) {
                        ctx.font = '36px Arial'; ctx.textAlign = 'center';
                        ctx.fillText('🔒', cx + cardW / 2, cy + 96);
                    } else {
                        // Čtverečkovaná miniatura trasy
                        ctx.save();
                        ctx.strokeStyle = '#D7CCC8'; ctx.lineWidth = 10;
                        const path = m.paths[0];
                        const scaleX = (cardW - 28) / W * 0.95;
                        const scaleY = 150 / (PLAY_BOTTOM - PLAY_TOP) * 0.9;
                        const offX = cx + 16, offY = cy + 16;
                        ctx.beginPath();
                        ctx.moveTo(offX + path[0].x * scaleX, offY + (path[0].y - PLAY_TOP) * scaleY);
                        for (let p = 1; p < path.length; p++) {
                            ctx.lineTo(offX + path[p].x * scaleX, offY + (path[p].y - PLAY_TOP) * scaleY);
                        }
                        ctx.stroke();
                        Sprites.drawGrandmaStation(ctx, cx + cardW / 2, cy + 90, 20, 20, this.time);
                        ctx.restore();
                    }

                    // Název mapy
                    ctx.font = '10px "Press Start 2P", monospace'; ctx.textAlign = 'center';
                    ctx.fillStyle = isLocked ? '#555566' : '#FFFFFF';
                    ctx.fillText(m.name.toUpperCase(), cx + cardW / 2, cy + 195);

                    // Hvězdičky obtížnosti
                    for (let s = 0; s < 3; s++) {
                        drawPixelStar(ctx, cx + cardW / 2 + (s - 1) * 20, cy + 225, 12, s < m.difficulty);
                    }

                    // Informace o vlnách
                    ctx.font = '7px "Press Start 2P", monospace'; ctx.fillStyle = '#90A4AE';
                    ctx.fillText(`WAVES:${m.waves} | PATHS:${m.paths.length}`, cx + cardW / 2, cy + 252);
                    ctx.fillText(`HP:${m.startLives} | YARN:${m.startYarn}`, cx + cardW / 2, cy + 272);

                    if (isLocked) {
                        ctx.fillStyle = '#EF5350';
                        ctx.fillText(`DOKONCI MAPU ${i}`, cx + cardW / 2, cy + 312);
                    } else {
                        pBox(ctx, cx + 24, cy + 295, cardW - 48, 34, isHovered ? '#2E7D32' : '#1B5E20', '#4CAF50', '#81C784', '#0E3813');
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillText('► START', cx + cardW / 2, cy + 314);
                    }
                }

                // Tlačítko Zpět
                pBox(ctx, 30, 26, 92, 36, '#262238', '#FFD700', '#63598C', '#151322');
                ctx.font = '8px "Press Start 2P", monospace'; ctx.fillStyle = '#FFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('◄ ZPET', 76, 44);

                // Tlačítko zvuku
                pBox(ctx, W - 60, 26, 44, 36, '#262238', '#FFD700', '#63598C', '#151322');
                ctx.font = '18px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(this.game.audio.enabled ? '🔊' : '🔇', W - 38, 44);

                // ── ANIMACE OTEVŘENÍ MAPY (Retro pixel wipe) ──
                if (this.transition) {
                    const tr = this.transition;
                    const progress = Math.min(1, tr.time / tr.duration);
                    const ease = easeInOutCubic(progress);
                    const m = MAP_CONFIGS[tr.mapIndex];

                    ctx.fillStyle = `rgba(0, 0, 0, ${ease * 0.85})`;
                    ctx.fillRect(0, 0, W, H);

                    const curX = lerp(tr.cardRect.x, 0, ease);
                    const curY = lerp(tr.cardRect.y, 0, ease);
                    const curW = lerp(tr.cardRect.w, W, ease);
                    const curH = lerp(tr.cardRect.h, H, ease);

                    pBox(ctx, curX, curY, curW, curH, m.bgColor, '#FFD700', '#FFF', '#000');

                    for (let p of tr.particles) {
                        pRect(ctx, p.x, p.y, p.size, p.size, p.color);
                    }

                    if (progress < 0.88) {
                        ctx.font = '14px "Press Start 2P", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillStyle = '#FFD700';
                        ctx.fillText(`LOADING: ${m.name.toUpperCase()}...`, W / 2, H * 0.85);
                    }

                    if (progress > 0.80) {
                        const flashAlpha = (progress - 0.80) / 0.20;
                        ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha * 0.9})`;
                        ctx.fillRect(0, 0, W, H);
                    }
                }
            }

            handleClick(mx, my) {
                if (this.transition) return;

                if (pointInRect(mx, my, W - 60, 26, 44, 36)) {
                    this.game.audio.toggleSound();
                    return;
                }

                if (pointInRect(mx, my, 30, 26, 92, 36)) {
                    this.game.audio.play('click');
                    this.game.setState('menu');
                    return;
                }

                const cardW = 244, cardH = 345, startX = 76, gap = 60, cy = 115;
                for (let i = 0; i < MAP_CONFIGS.length; i++) {
                    const cx = startX + i * (cardW + gap);
                    if (pointInRect(mx, my, cx, cy, cardW, cardH)) {
                        if (unlockedMaps[i]) {
                            this.startMapTransition(i, cx, cy, cardW, cardH);
                        } else {
                            this.game.audio.play('locked');
                        }
                        return;
                    }
                }
            }

            handleMouseMove(mx, my) {
                if (this.transition) {
                    this.hoveredCard = null;
                    this.backHovered = false;
                    this.soundHovered = false;
                    this.game.canvas.style.cursor = 'default';
                    return;
                }
                this.soundHovered = pointInRect(mx, my, W - 60, 26, 44, 36);
                this.backHovered = pointInRect(mx, my, 30, 26, 92, 36);
                this.hoveredCard = null;
                const cardW = 244, cardH = 345, startX = 76, gap = 60, cy = 115;
                for (let i = 0; i < MAP_CONFIGS.length; i++) {
                    const cx = startX + i * (cardW + gap);
                    if (pointInRect(mx, my, cx, cy, cardW, cardH)) {
                        this.hoveredCard = i;
                        break;
                    }
                }
                this.game.canvas.style.cursor = (this.hoveredCard !== null || this.backHovered || this.soundHovered) ? 'pointer' : 'default';
            }
        }

        // ─────────────────────────────────────────────
        //  HLAVNÍ SPRÁVCE HRY (GAME CONTROLLER)
        // ─────────────────────────────────────────────
        class Game {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.ctx.imageSmoothingEnabled = false;
                this.audio = new AudioManager();

                this.canvas.width = W;
                this.canvas.height = H;

                this.currentState = 'menu';
                this.screens = {
                    menu: new MainMenu(this),
                    mapSelect: new MapSelect(this),
                    game: null
                };
                this.currentScreen = this.screens.menu;

                this.lastTime = 0;
                this._setupEvents();
                this._resize();
                window.addEventListener('resize', () => this._resize());
            }

            toggleFullscreen() {
                const doc = window.document;
                const docEl = doc.documentElement;
                const requestFs = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
                const cancelFs = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen || doc.msExitFullscreen;
                const isFs = !!(doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement);

                if (!isFs) {
                    if (requestFs) {
                        const p = requestFs.call(docEl);
                        if (p && p.catch) p.catch(() => {});
                    }
                } else {
                    if (cancelFs) {
                        const p = cancelFs.call(doc);
                        if (p && p.catch) p.catch(() => {});
                    }
                }
                setTimeout(() => this._resize(), 100);
            }

            _setupEvents() {
                const unlock = () => {
                    this.audio.init();
                };
                window.addEventListener('click', unlock, { passive: true });
                window.addEventListener('pointerdown', unlock, { passive: true });
                window.addEventListener('touchstart', unlock, { passive: true });

                this.canvas.addEventListener('click', (e) => {
                    unlock();
                    const rect = this.canvas.getBoundingClientRect();
                    const mx = (e.clientX - rect.left) * (W / rect.width);
                    const my = (e.clientY - rect.top)  * (H / rect.height);
                    if (this.currentScreen) this.currentScreen.handleClick(mx, my);
                });

                this.canvas.addEventListener('mousemove', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const mx = (e.clientX - rect.left) * (W / rect.width);
                    const my = (e.clientY - rect.top) * (H / rect.height);
                    if (this.currentScreen && this.currentScreen.handleMouseMove) this.currentScreen.handleMouseMove(mx, my);
                });

                window.addEventListener('keydown', (e) => {
                    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') {
                        e.preventDefault();
                    }
                    this.audio.init();
                    if (e.code === 'KeyF' || e.code === 'F11') {
                        e.preventDefault();
                        this.toggleFullscreen();
                        return;
                    }
                    if (this.currentScreen && this.currentScreen.handleKeyDown) this.currentScreen.handleKeyDown(e.code);
                });

                ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
                    document.addEventListener(evt, () => this._resize());
                });
            }

            _resize() {
                const aspect = W / H;
                const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
                const padX = isFs ? 0 : (window.innerWidth > 1000 ? 28 : 12);
                const padY = isFs ? 0 : (window.innerHeight > 700 ? 24 : 10);
                const headerH = isFs ? 0 : 34;
                const cabinetPad = isFs ? 0 : 20;

                const availW = Math.max(320, window.innerWidth - padX * 2 - cabinetPad);
                const availH = Math.max(240, window.innerHeight - padY * 2 - cabinetPad - headerH);

                let w = availW, h = availW / aspect;
                if (h > availH) {
                    h = availH;
                    w = availH * aspect;
                }
                this.canvas.style.width = Math.floor(w) + 'px';
                this.canvas.style.height = Math.floor(h) + 'px';
            }

            setState(state) {
                this.currentState = state;
                if (state === 'menu') {
                    this.screens.menu = new MainMenu(this);
                    this.currentScreen = this.screens.menu;
                } else if (state === 'mapSelect') {
                    this.screens.mapSelect = new MapSelect(this);
                    this.currentScreen = this.screens.mapSelect;
                } else if (state === 'game') {
                    this.currentScreen = this.screens.game;
                }
            }

            startGame(mapId) {
                this.screens.game = new GameScreen(this, mapId);
                this.setState('game');
            }

            start() {
                this.lastTime = performance.now();
                requestAnimationFrame((t) => this._loop(t));
            }

            _loop(timestamp) {
                const dt = Math.min(0.05, (timestamp - this.lastTime) / 1000);
                this.lastTime = timestamp;
                if (this.currentScreen) this.currentScreen.update(dt);
                this.ctx.clearRect(0, 0, W, H);
                if (this.currentScreen) this.currentScreen.render(this.ctx);
                requestAnimationFrame((t) => this._loop(t));
            }
        }

        // ─────────────────────────────────────────────
        //  SPUŠTĚNÍ HRY
        // ─────────────────────────────────────────────
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('gameCanvas');
            const game = new Game(canvas);
            game.start();
        });
    </script>
</body>
